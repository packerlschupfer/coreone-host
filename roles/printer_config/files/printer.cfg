
# =============================================================================
# Prusa Core One+ — consolidated Klipper printer.cfg
# =============================================================================
# Copy to the machine running klippy (e.g. ~/printer_data/config/printer.cfg).
# Hardware (mcu, motion, TMC, extruder, heaters, loadcell probe, homing) lives in
# boards/xbuddy.cfg — verified Phase 1-3, see docs/klipper_*.md. This file adds the
# printer-level layer (bed mesh, input shaper, usability, macros).
#
# Fix the [mcu] serial in boards/xbuddy.cfg to the real /dev/serial/by-id path.
# Calibration-derived values (loadcell counts_per_gram, probe z_offset, bed mesh,
# input_shaper) are filled in on hardware and land in the SAVE_CONFIG block below.
# =============================================================================

[include boards/xbuddy.cfg]

# === Calibration-managed sections (live here, NOT in the include, so Klipper's
# === SAVE_CONFIG can rewrite them: heater PID, probe z_offset, etc.) ===========


[extruder]
step_pin: PD1
dir_pin: PD0
enable_pin: !PD10
microsteps: 16
rotation_distance: 8.0       # E = 400 steps/mm (3200/400). DIRECT e-step cal 2026-06-28: 3 mark-measure runs (F50+F100), slip ruled out (slow run same/more under) -> measured ~400 (rd 7.97-8.02); supersedes the 2026-06-22 revert to 380 (8.4211) which under-extruded ~5pct. Flow must be re-done at 400.
nozzle_diameter: 0.40
filament_diameter: 1.75
max_extrude_only_distance: 150   # allow LOAD/UNLOAD_FILAMENT (50-60mm) extrude-only moves
max_extrude_cross_section: 5     # tolerate the wide prime line in PRINT_START
max_extrude_only_velocity: 60    # Prusa E max feed 50 mm/s (HW 100) — covers LOAD_FILAMENT F1800
max_extrude_only_accel: 1250     # Prusa DEFAULT_RETRACT_ACCELERATION 1250
pressure_advance: 0.036          # FALLBACK ONLY (= Prusa Core One PLA; was 0.03 generic Klipper default).
                                 # Per-print PA comes from the slicer's M572 in filament_start_gcode and overrides this.
                                 # VERIFIED against the live OrcaSlicer profiles 2026-07-19:
                                 #   PLA .028 | PLA HS .022 | PLA HS Summer .020 | PETG .034
                                 # (The previous note here said "PLA .036/PETG .053/ASA .020" -- ALL THREE were stale/wrong.
                                 #  Independently corroborated by the loadcell phase-lag measurement: PETG 0.031-0.038, PLA HS 0.020-0.023.)
                                 # !! ASA sets NO M572 at all, so ASA prints actually RUN on this 0.036 PLA fallback = UNCALIBRATED.
                                 # PA tower / TUNING_TOWER on hardware; Prusa stores PA per-filament
                                 # PA tower / TUNING_TOWER on hardware; Prusa stores PA per-filament
pressure_advance_smooth_time: 0.04
heater_pin: PB1
# Phase 2.5: hotend = 100k NTC TDK NTCG104LH104JT1 (TEMP_SENSOR_0=2005), pin PC0.
# WORKING at room temp: requires (a) EXTRUDER_SWITCH=PE14 driven LOW — see the
# [output_pin extruder_switch] below — which Buddy holds low at boot to switch in
# the toolhead NTC pullup, and (b) pullup_resistor=650, because the EFFECTIVE
# pullup on this toolhead channel is ~650R (the xBuddy P166 4.7k via 3V3_SWITCH_2
# in parallel with the LoveBoard pullup), NOT Klipper's default 4.7k. Verified:
# reads 26.2C, matching the bed (26.2C) at the same ambient.
# CALIBRATION RESOLVED (2026-06-07). pullup_resistor=430 is the HOT anchor: derived
# vs a K-type @150C (the old 650 read ~15C low when hot). It is deliberately matched
# to the OPERATING range, not room temp.
# Cold cross-check (idle, all heaters off): nozzle reads 33.3C while the trusted bed
# (25.2C) and chamber (25.3C) agree, and the heatbreak NTC on the SAME toolhead reads
# 23.0C — a passive block 1cm from a cold heatbreak with 0 heater power CANNOT be at
# 33C, so this is a genuine ~+8C SENSOR offset at room temp, not residual heat.
# DO NOT try to fix the cold reading with inline_resistor / a 2-point fit. The cold
# end is the INSENSITIVE end of the divider (100k thermistor >> the ~430R pullup), so
# forcing the model through 25C needs a large param swing that wrecks the SENSITIVE
# print range: a fit to (25C,150C) CEILINGS at 215-290C (computes negative R ->
# NaN/inf temp, would defeat thermal-runaway protection); a fit to (25C,250C) still
# smears +/-10..45C across 215-290C. The +8C cold offset is the correct PRICE of a
# hot-anchored curve — accept it. (Math: docs/hotend_thermistor_cold_offset.py.)
# Only genuinely-unvalidated point: ABSOLUTE accuracy at real print temps (215-290) —
# the sole hot anchor is 150C, above which it extrapolates. If ever in doubt, K-type
# at a settled 250C and (if off) re-derive pullup_resistor ALONE — never add inline.
sensor_type: TDK NTCG104LH104JT1
sensor_pin: PC0
pullup_resistor: 650        # REVERTED 2026-06-15: 430 over-read -> cold nozzle, poor 1st-layer adhesion; 650 = hw-derived effective pullup (Prusa default), trust the TDK table
#control: pid
# ⚠ PID values are Klipper PLACEHOLDERS. Prusa's Marlin gains (Kp14/Ki1/Kd100) do
# NOT transfer — Klipper scales the I/D terms differently. Run PID_CALIBRATE
# HEATER=extruder TARGET=215 on hardware; SAVE_CONFIG overwrites these.
#pid_Kp: 22.0
#pid_Ki: 1.08
#pid_Kd: 114.0
min_temp: 5                 # Prusa HEATER_0_MINTEMP 5 — catches an open/shorted NTC
max_temp: 305               # Prusa HEATER_0_MAXTEMP 305 (⚠ trust only after hot-cal)
min_extrude_temp: 145       # lowered from Klipper's default 170 so a guarded retract is legal at the
                            # ~150C probe temp (PRINT_END retracts at probe temp; Klipper has no M302,
                            # Prusa uses M302 S155 for the same trick). Safe cold-extrude floor (PLA soft at 145).

[heater_bed]
heater_pin: PB0
sensor_type: ATC Semitec 104GT-2       # Phase 2.2: confirmed reads room temp (~27C) correctly
sensor_pin: PA4
control: pid
# CALIBRATED on hardware (PID_CALIBRATE HEATER=heater_bed TARGET=60, 2026-06-04).
# SAVE_CONFIG will overwrite these if you re-tune.
pid_Kp: 58.507
pid_Ki: 0.707
pid_Kd: 1211.095
min_temp: 5                 # Prusa BED_MINTEMP 5
max_temp: 125              # Prusa BED_MAXTEMP = the shutdown CUTOFF. Targets are held 5C under
                           # (PRINT_START band + Tune menu cap at 120) so PID overshoot can't cross it.

# --- ENCLOSURE fans / chamber: on the H503 extension (NOT here) ---------------
# CORRECTION of an earlier assumption: the part-cooling + heatbreak fans ARE on
# this main board (PE11/PE9, configured in the Toolhead fans section above).
# Verified in Prusa's fanctl/xbuddy/fanctl_instances.cpp: for the Core One,
# Fans::print()=fanPrintPwm(PE11) and Fans::heat_break()=fanHeatBreakPwm(PE9).
# (The fans-over-Modbus path is iX-ONLY — fan_ctl_ix_turbine.cpp.)
# The extension (H503) carries the SEPARATE enclosure hardware: the chamber-
# cooling fan ext_chamber (a [temperature_fan] regulated to the filament's chamber
# target via M141/M191 — cooling-only, vents to hold temp at/below target), a
# separate (not-yet-fitted) ext_filtration fume fan, RGBW LED, chamber thermistor,
# filament + door sensors. The H503 runs our Klipper port as a second MCU over its
# own USB-C (Prusa reaches the equivalent hardware over Modbus/PuppyBus); its
# enclosure config now lives in h5/extension.cfg ([include]d from printer.cfg).

# --- Loadcell Z-probe (HX717) — Phase 3: nozzle-on-bed probing ---------------
# VERIFIED Phase 2: the HX717 reads + responds to force (bit-bang PG1/PE7).
# [load_cell_probe] is the combined sensor + load-cell + probe; the nozzle IS the
# probe (x/y offset 0), so stepper_z uses endstop_pin probe:z_virtual_endstop.
# HOST DEPS: requires NumPy; the optional noise filters require SciPy.
# NOT YET RUN ON HARDWARE — trigger_force / z_offset must be set by calibration,
# and the first probe must be supervised (slow Z toward the bed). See
# docs/klipper_loadcell_probe.md.
[load_cell_probe]
sensor_type: hx717
data_ready_irq: True   # DOUT EXTI (frees main loop for 8kHz)
dout_pin: PE7
sclk_pin: PG1
# --- calibration (set with LOAD_CELL_CALIBRATE; required before probing) ---
counts_per_gram: 52.083
reference_tare_counts: -325014
sensor_orientation: normal
# --- probe behaviour ---
force_safety_limit: 4000      # widened from 2000: tolerate the loadcell baseline thermal drift (re-tare was room-temp, probe runs hot); per-probe fresh tare + 75g trigger still govern the actual touch
trigger_force: 75.0           # contact trigger at 75 g (Klipper default)
notch_filter_frequencies: 50  # reject 50 Hz mains hum (EU); needs SciPy
#z_offset: 0                   # set via PROBE_CALIBRATE on hardware
speed: 1.5                    # probe descent (mm/s) -- Prusa final probe ~1.17mm/s (70mm/min); slower = more loadcell samples/mm = better trigger precision (was 3)
lift_speed: 20                # fast Z retract between taps + inter-point lifts (was defaulting to probe speed 3); measurement descent stays 3 for loadcell accuracy
samples: 3                    # 3 taps (Prusa does many: MULTIPLE_PROBING 40)
samples_result: median        # median, not average -- one outlier tap can't skew the Z reference (was default average)
sample_retract_dist: 2
samples_tolerance: 0.03       # require taps within 30 um (Prusa: 75 um corner-to-corner)
samples_tolerance_retries: 5


# --- Loadcell clog / stuck-filament detector (F3, Prusa EMotorStallDetector port) -----
# 5-tap edge FIR over the toolhead HX717 ch-A force; trips on the clog pressure spike while
# the extruder pushes forward. Arming (ESTALL_DETECT ENABLE=1) turns the HX717 12:1 interleave
# ON; disarming hands the chip back to ch-B presence. PRODUCTION 2026-06-28: edge SIGN + threshold
# HW-validated -> on_stall pause / default_enabled True. NB the "0 false-trips across a full print"
# shakedown was SKIPPED per user call -- watch the first prints; if a spurious pause hits, drop
# on_stall back to 'log' (capture filtered/E-state) and raise detection_threshold or fix the gate.
[estall_detect]
detection_threshold: 700000     # VALIDATED 2026-06-28 (counts_per_gram 52.083 == Prusa 0.0192 g/count, 320 Hz)
invert: False                   # VALIDATED -- edge went positive past +700000 in the controlled-clog test
on_stall: pause                 # ARMED 2026-07-26: pause on clog. The 2026-06-28 "marginal first-layer"
                                #   trips (749804, 588362) were later shown NON-normal (a mini-clog + a
                                #   nozzle edge-strike on under-squished PETG), not back-pressure -- so the
                                #   old ~825000 plan is RETRACTED. Clean-PLA data closes it: n=267660,
                                #   max=63841 (~9% of thr, ~11x margin, 0 crossings); real clog was 897506,
                                #   so 700000 sits cleanly between. WATCH the first PETG/ASA first-layers
                                #   hand-on-PAUSE (they push harder); a spurious first-layer pause -> fix is
                                #   a first-layer gate (arm at layer >= 2), NOT raising the threshold.
default_enabled: True           # Core One config_store default ON (armed per-print via PRINT_START)
min_extrude_speed: 0.5          # E-pushing gate (mm/s); detection gated shut below this
report_interval: 1.0

# --- Bed mesh (loadcell-probed; nozzle = probe, no x/y offset) ----------------
[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 230, 200            # within position_max (X 252 / Y 221) minus margins
probe_count: 5, 5
algorithm: bicubic
adaptive_margin: 5                  # ADAPTIVE meshes extend 5mm past part bbox
zero_reference_position: 125, 110   # GEOMETRIC bed centre (250x220); was 125,105
fade_start: 1
fade_end: 10

# --- Input shaper (resonance tuning) -----------------------------------------
# ADXL345 wired to the xBuddy ACCELEROMETER connector (SPI2): the F427 reads it
# directly — no extra MCU, no firmware reflash ([lis3dh] uses the existing SPI).
# Pins from hwio_pindef/hal_msp (acellCs PA10, SPI2 SCK PB10 / MISO PC2 / MOSI PC3).
# Software SPI so it works regardless of Klipper's F4 bus table; fast enough for IS.
#
# WORKFLOW (after the ADXL is connected + this is uncommented + klippy restarted):
#   ACCELEROMETER_QUERY            -> confirm it responds; note which axis reads ~ +/-9.8
#   (fix axes_map below to match the mount orientation if needed)
#   MEASURE_AXES_NOISE             -> want each axis < ~100
#   SHAPER_CALIBRATE               -> sweeps X and Y at probe_points; SAVE_CONFIG
#   then disconnect the ADXL — the saved [input_shaper] freqs persist.
[lis3dh]
cs_pin: PA10                            # xBuddy accel connector CS (acellCs)
spi_software_sclk_pin: PB10             # SPI2 SCK
spi_software_mosi_pin: PC3              # SPI2 MOSI
spi_software_miso_pin: PC2              # SPI2 MISO
axes_map: x,y,z                         # ADJUST to the physical mount (see ACCELEROMETER_QUERY)
[resonance_tester]
accel_chip: lis3dh
probe_points: 125, 105, 150            # Z150 clears a toolhead-mounted accel; Z20 crushed it 2026-06-07
#
# Result of SHAPER_CALIBRATE lands here (or set manually from a ringing tower):
[input_shaper]
#shaper_type_x: ei          # ILLUSTRATIVE samples only. Your LIVE calibrated values are written to the
#shaper_freq_x: 55.4        # SAVE_CONFIG block (file tail) by SHAPER_CALIBRATE -- these commented numbers
#shaper_type_y: mzv         # are an OLD example (Y has since re-cal'd higher), NOT current. Don't trust them.
#shaper_freq_y: 43.4
# Method (2026-06-07, accel toolhead-mounted @ Z150): X dominant ~59Hz; chose ei over
# Klipper's 3hump_ei@118 (ei is simpler/more robust, both hit 0% vib). Accel ceiling is
# 10000 (boards/xbuddy.cfg); the slicer drives per-feature accel via M204.

# --- Usability ---------------------------------------------------------------
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
[display_status]
[exclude_object]
[idle_timeout]
timeout: 300
gcode:
    {% if printer.pause_resume.is_paused %}
        # PAUSED: preserve resumability -- keep STEPPERS energized (do NOT lose the homing/Z
        # reference) and the BED hot; cool only the HOTEND (unattended-safety). RESUME reheats it.
        # A separate 2h watchdog (_paused_bed_watchdog, armed by PAUSE) drops the bed if a paused
        # print is forgotten -- see below.
        M104 S0
        M117 Paused (idle): hotend cooled, RESUME will reheat
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

# A6: forgotten-paused-print safety. PAUSE arms this at 2h; RESUME cancels it. If still paused when
# it fires, drop the bed (a 120C bed otherwise sits unattended for days in a closed enclosure).
# Steppers stay energized so the Z/homing reference survives; note the cooled bed means resume
# adhesion is no longer guaranteed past this point.
[delayed_gcode _paused_bed_watchdog]
gcode:
    {% if printer.pause_resume.is_paused %}
        M140 S0
        M117 Paused >2h: bed OFF (forgotten?)
        M118 idle-safety: print paused >2h -- bed heater turned OFF. Re-heat before RESUME.
    {% endif %}

[respond]
# Shows "Mesh N/total" on the LCD while BED_MESH_CALIBRATE probes (extras/mesh_progress.py).
[mesh_progress]
# Graceful soft-cancel (extras/soft_cancel.py): interrupts in-flight blocking
# waits WITHOUT an emergency stop -> clean abort to idle, no FIRMWARE_RESTART.
[soft_cancel]
# Per-build-sheet first-layer squish bias (extras/sheets.py); thickness is auto via
# the loadcell G28 Z, so the per-sheet value is purely the surface squish bias.
#
# ⚠ SIGN CONVENTION = PRUSA Live-Z (verified empirically + in gcode_move.py, 2026-06-22). The sheet value is
# applied as the raw gcode offset (sheets.py: SET_GCODE_OFFSET Z=<value>, no flip; == homing_origin.z). In
# Klipper, SET_GCODE_OFFSET Z=+v does base_position += v, so a later G1 Z<g> goes to toolhead = g + v — i.e.
# +v moves the toolhead UP (verified live: +0.5 -> toolhead.position.z 20.0 -> 20.52). The Klipper-DOCS
# phrasing ("Z=0.2 -> toolhead -0.2") is misleading; the CODE adds the offset. So:
#   NEGATIVE value -> toolhead LOWER  -> MORE squish (closer to bed)   <- matches PrusaSlicer Live-Z
#   POSITIVE value -> toolhead HIGHER -> LESS squish (more lift)
# Enter PrusaSlicer Live-Z values AS-IS (negative = more squish). To INCREASE squish, go MORE NEGATIVE.
[sheets]
sheets: textured, smooth, satin
default_sheet: textured
[gcode_arcs]
resolution: 0.2

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_speed: 25          # matches Orca deretraction_speed (NOT 35)
# Inert with our own slicer profile (use_firmware_retraction=0 -> explicit G1 E-, no G10/G11).
# Present so ANY profile emitting G10/G11 (e.g. a PrusaSlicer user) retracts correctly instead of
# silently retracting 0mm (Klipper's default). Removed 2026-06-23 as "inert"; restored 2026-08-20
# because inert-with-sane-values costs nothing, while its absence cost an adopter an evening.

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

# (No Prusa->Klipper adapter needed: the [sheets] convention IS already Prusa Live-Z — negative = more
# squish — so PrusaSlicer Live-Z values are entered directly via SHEET_SAVE_Z / the LCD. A SET_PRUSA_LIVEZ
# macro briefly lived here on a WRONG premise (assumed Klipper-native) and would have double-negated; removed.)

# --- Print macros (positions/lengths are sane defaults — tune on hardware) ----
[gcode_macro PREHEAT]
# Enclosure heat-soak preheat (ABS/ASA). The Core One has NO chamber heater — the
# chamber is heated PASSIVELY by the bed. So this: heats the bed high, parks the
# toolhead at bed CENTRE for even radiation, holds the chamber fan OFF (M141 S0 —
# don't vent the heat-soak), waits the bed, then waits the chamber toward a MINIMUM
# and soaks. CHAMBER is a floor to reach (no closed-loop setpoint).
#   Usage: PREHEAT BED=100 CHAMBER=40 SOAK=10 [EXTRUDER=0] [Z=50]
# Keep EXTRUDER low/0: G28 Z loadcell-probes with the nozzle TOUCHING the bed, so a hot
# oozing nozzle corrupts the home. Ramp the hotend in PRINT_START afterwards.
gcode:
    {% set bed     = params.BED|default(100)|float %}
    {% set chamber = params.CHAMBER|default(0)|float %}
    {% set soak    = params.SOAK|default(0)|int %}
    {% set hotend  = params.EXTRUDER|default(0)|float %}
    {% set zpark   = params.Z|default(50)|float %}
    M140 S{bed}                                  # bed -> target (start heating now)
    M104 S{hotend}                               # hotend default OFF -> clean nozzle to home
    M141 S0                                      # chamber fan OFF while heating (don't vent the soak)
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28                                      # home so we can centre (keep EXTRUDER low!)
    {% endif %}
    G90
    G1 Z{zpark} F1200                            # lift clear of the bed
    # cold-start offset guard: a lingering non-zero Z gcode-offset (Live-Z dial outside a print)
    # poisons safe_z_home's z_hop (a Z move) while Z is unhomed -> 'Must home axis first' at G28 Z.
    # Fake Z-homed so it zeroes without a poisoning delta; G28 Z re-homes + APPLY_SHEET re-applies.
    {% if printer.gcode_move.homing_origin.z|abs > 0.0001 and 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z}   # fake Z at axis_max, NOT 10: G28 Z descends from the faked Z; faking low made the loadcell probe give up ~15mm down and miss the bed ("No trigger") when parked high. Fixed 2026-06-22.
        SET_GCODE_OFFSET Z=0 MOVE=0
        SET_KINEMATIC_POSITION CLEAR_HOMED=Z   # F4: un-fake Z -> reads UNHOMED again (not "homed" at axis_max) through the heat window, so a Mainsail Z jog can't drive the bed into the nozzle; the real G28 Z re-homes below.
    {% endif %}
    G1 X125 Y105 F6000                           # park bed CENTRE for even heat radiation
    M190 S{bed}                                  # wait bed at target
    {% if chamber > 0 %}
        CHAMBER_WAIT MINIMUM={chamber}           # circulate + wait chamber to the floor
    {% endif %}
    {% if soak > 0 %}
        M117 Heat soak {soak} min
        SOAK_WAIT MINUTES={soak}                 # dwell so frame/chamber stabilise
    {% endif %}
    M117 Preheat ready

[gcode_macro PRINT_START]
# slicer start gcode: PRINT_START BED=[bed_temperature] EXTRUDER=[nozzle_temperature]
#   BED + EXTRUDER are REQUIRED and guarded below: a missing/misspelled key or a
#   garbage value ABORTS the print rather than silently using a default (a dropped
#   key used to fall through to 215/60 -> wrong-temp print). Band = the configured
#   heater limits (extruder max_temp 305, bed max_temp 120), kept a touch inside.
#   optional params: CHAMBER=<C> (filament chamber_temperature -> chamber-fan
#   target: low/<ambient (PLA) vents now, high (ABS) keeps it warm + regulates,
#   0 = off), SOAK=<min> (bed/chamber heat-soak dwell — gives a hot chamber a
#   head-start), ADAPTIVE=1 (probe only the labelled print area — needs the
#   slicer's "Label objects"/EXCLUDE_OBJECT output), PROBE_TEMP=<C> (nozzle temp
#   held during probing; default 150).
# KEY: the loadcell probes with the nozzle TOUCHING the bed, so it must be CLEAN. We
# hold a low, non-oozing temp through homing+mesh, then ramp to print temp afterward.
# Probing at full print temp (the old order) lets filament ooze and corrupts the mesh.
gcode:
    SOFT_ABORT_RESET                 # clear any stale soft-abort flag from a prior run
    # --- silent-default guard: BED + EXTRUDER are required + sane (abort, no print) ---
    {% if 'EXTRUDER' not in params or 'BED' not in params %}
        { action_raise_error("PRINT_START: missing EXTRUDER/BED - slicer Start G-code must pass both (silent-default guard)") }
    {% endif %}
    {% set bed = params.BED|float %}
    {% set hotend = params.EXTRUDER|float %}
    {% if hotend < 150 or hotend > 300 %}
        { action_raise_error("PRINT_START: EXTRUDER=%.0f out of range 150-300C" % hotend) }
    {% endif %}
    {% if bed < 40 or bed > 120 %}
        { action_raise_error("PRINT_START: BED=%.0f out of range 40-120C" % bed) }
    {% endif %}
    {% set min_ext = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    # Probe/MBL temp: held through homing+mesh, kept LOW so the nozzle doesn't ooze onto the loadcell.
    # Material-aware default like Prusa's MBL temp -- PLA/PETG 150 (minimal ooze); high-temp (ABS/ASA/PC,
    # EXTRUDER>=240) 170 so the tip isn't cold-gummy (still far below their print temp = low ooze). Slicer
    # can override per-filament with PROBE_TEMP.
    {% set probe_temp = params.PROBE_TEMP|default(170 if hotend >= 240 else 150)|float %}
    {% set soak = params.SOAK|default(0)|int %}
    {% set adaptive = params.ADAPTIVE|default(1)|int %}
    {% set chamber = params.CHAMBER|default(0)|float %}
    # CHAMBER_MIN (optional): after bed-heat + SOAK, block until the chamber passively reaches this
    # (e.g. ASA 45) so cold-chamber warp is avoided. Passive only (no chamber heater) -> capped 70.
    # MUST be below CHAMBER (the vent ceiling), else M141 venting fights the warmup and it stalls.
    {% set chamber_min = params.CHAMBER_MIN|default(0)|float %}
    {% if chamber_min > 70 %}{% set chamber_min = 70.0 %}{% endif %}
    # ON_TIMEOUT policy for the CHAMBER_MIN gate below. AUTO (no explicit param): ABORT if this
    # material needs a warm enclosure (CHAMBER vent ceiling >= 45C -> ASA/ABS), else CONTINUE
    # (PLA/PETG comfort). Explicit `PRINT_START ... ON_TIMEOUT=CONTINUE|ABORT` overrides. The
    # slicer needs NO new param -- this derives from the CHAMBER value it already sends.
    {% set on_timeout = params.ON_TIMEOUT|default('ABORT' if chamber >= 45 else 'CONTINUE')|upper %}
    {% if chamber_min > 0 and chamber_min >= chamber %}
        { action_raise_error("PRINT_START: CHAMBER_MIN=%.0f must be below CHAMBER=%.0f (the vent ceiling) so venting doesn't fight the passive warmup" % (chamber_min, chamber)) }
    {% endif %}
    {% set safe = printer.save_variables.variables.safe_print_mode|default(0)|int %}   # SAFE_PRINT_MODE: force the known-good path while validating new defaults
    {% set crash_shadow = printer.save_variables.variables.crash_shadow|default(0)|int %}   # CRASH_SHADOW: arm crash-detect in telemetry-only SHADOW mode (tuning) instead of the live detector
    {% set phasestep = 0 if safe else params.PHASE_STEP|default(1)|int %}   # DEFAULT 1 = analytic phase-stepping (2026-06-27: the analytic-trajectory rewrite P0-P5+ fixed the fast-travel under-tracking that forced the 2026-06-26 revert -- now 36kHz/5.25MHz, ~360mm/s ceiling. PHASE_STEP=0 falls back to step/dir + crash detection; SAFE_PRINT_MODE forces 0).
    {% if safe %}{ action_respond_info("SAFE PRINT MODE: forcing PHASE_STEP=0 + OFFBED=0 (step/dir, crash-detect, on-bed prime). SAFE_PRINT_MODE VALUE=0 to use the new defaults.") }{% endif %}
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=accel_ceiling VALUE=10000   # reset height-taper cap for a fresh print
    SET_VELOCITY_LIMIT ACCEL=1500 SQUARE_CORNER_VELOCITY=7   # working defaults (Prusa travel 1500 / SCV~7); slicer M204 overrides accel per feature
    LIGHTS V=1                        # chamber light ON for the print (door auto-off skips while printing)
    M104 S{probe_temp}                # nozzle -> low non-oozing probe temp
    M140 S{bed}                       # bed -> target (probe/print on a hot bed)
    M141 S{chamber}                   # chamber-fan target: <ambient (PLA) vents now;
    # Defensive: clear any bed mesh loaded OUTSIDE this print (manual BED_MESH_PROFILE LOAD, a
    # diagnostic, etc.). An ACTIVE mesh Z-transforms every move, so the cold XY-home park below
    # (Z deliberately unhomed until the hot G28 Z) fails "Must home axis first". The mesh is
    # (re)built adaptively after G28 Z; a saved profile is never used for a print anyway.
    BED_MESH_CLEAR
    # Home XY COLD -- StallGuard reliable cold, too noisy in a hot chamber (hot Y motor ->
    # premature trips). Bed/chamber still cold right after the SETS above; M190/M109 soak
    # waits come AFTER homing. Z still probes HOT (G28 Z, after M109).
    G28 X Y                           # cold grille-safe XY home via unified G28 (MSCNT Y -> jog Y15 -> MSCNT X); Z left unhomed for the HOT probe below
    # cold-start offset guard (validated 2026-06-18; reconciled to live 2026-06-21): a lingering non-zero Z
    # gcode-offset (Live-Z dialed OUTSIDE a print, or a leftover babystep) poisons safe_z_home's z_hop -- a Z
    # move -- while Z is unhomed -> "Must home axis first" at G28 Z (the park above is X/Y-only so it slips
    # through). Fake Z-homed so the offset zeroes WITHOUT a poisoning delta; G28 Z below re-homes Z for real
    # and APPLY_SHEET re-applies the sheet bias. Only fires when actually needed (offset!=0 AND Z unhomed).
    {% if printer.gcode_move.homing_origin.z|abs > 0.0001 and 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z}   # fake Z at axis_max, NOT 10: G28 Z descends from the faked Z; faking low made the loadcell probe give up ~15mm down and miss the bed ("No trigger") when parked high. Fixed 2026-06-22.
        SET_GCODE_OFFSET Z=0 MOVE=0
        SET_KINEMATIC_POSITION CLEAR_HOMED=Z   # F4: un-fake Z -> reads UNHOMED again (not "homed" at axis_max) through the heat window, so a Mainsail Z jog can't drive the bed into the nozzle; the real G28 Z re-homes below.
    {% endif %}
    G1 X125 Y110 F6000                # park GEOMETRIC centre (250x220 bed; was 125,105) for even heat soak
    #   high (ABS) -> fan off, chamber warms toward + regulates at it; 0 -> off. The
    #   SOAK dwell below lets a hot chamber pre-warm before probing.
    M117 Heating bed
    M190 S{bed}                       # wait bed
    {% if soak > 0 %}
        M117 Heat soak {soak} min
        SOAK_WAIT MINUTES={soak}      # let the chamber/bed stabilise before probing
    {% endif %}
    # CHAMBER_MIN gate: bed is hot, nozzle at low probe-temp (no ooze) -> passive warm continues.
    # Reuses CHAMBER_WAIT (TEMPERATURE_WAIT on "temperature_fan ext_chamber"). Returns instantly if
    # already >= target. No hard timeout (TEMPERATURE_WAIT has none) -> SOFT_ABORT bails if it stalls.
    {% if chamber_min > 0 %}
        M117 Chamber warmup {chamber_min|int}C
        CHAMBER_WAIT MINIMUM={chamber_min} ON_TIMEOUT={on_timeout}
    {% endif %}
    M117 Homing
    M109 S{probe_temp}                # nozzle STABLE + clean at probe temp -> accurate Z
    # NOTE: the Prusa-style pre-probe anti-ooze retract (E-2 before MBL, recover after) was REVERTED 2026-06-22
    # -- retracting at the cold 150C probe temp pulled melt up into the heatbreak and left the nozzle de-primed
    # (dry prime stripe + brim), and it also loaded the loadcell (probe trip, needed a settle dwell). Net cost
    # outweighed the ooze it prevented. Revisit anti-ooze with the slicer via a method that doesn't de-prime.
    G28 Z                             # safe_z_home -> centre (125,110) + loadcell Z probe (clean nozzle)
    M117 Bed leveling
    BED_MESH_CLEAR
    {% if adaptive %}
        BED_MESH_CALIBRATE ADAPTIVE=1 # probe only the labelled print area (faster)
    {% else %}
        BED_MESH_CALIBRATE            # full mesh — always safe
    {% endif %}
    # Prusa "Uneven bed" analogue: if the mesh Z span is gross (>=1mm), the gantry is likely
    # out of square -> auto Z_ALIGN + re-mesh once (PAUSE if still uneven). No-op on a flat bed.
    _UNEVEN_BED_CHECK ADAPTIVE={adaptive}
    # APPLY_SHEET is applied AFTER the purge (see the tail of this macro), NOT here: the sheet bias is
    # a Z gcode-offset that would squish the off-bed Y-2.5 purge into the bed (the purge sits outside
    # the mesh, so it also picks up the front-edge mesh comp). Set it just before the slicer's print body.
    # --- tip-clean gate (Prusa cleanup_probe / P9 analogue) --------------------
    # Verify the nozzle is clean enough to lay a good prime BEFORE the print-temp
    # ramp. Runs at the cool probe temp (minimal ooze/goo), taps near the prime
    # zone and DISCARDS Z (pass/fail only). ABORTS the print with a clear message
    # if the tip will not clean in 9 taps (e.g. baked-on ASA residue fouling the
    # nozzle -- see [[loadcell-first-layer-asa]]). TOLERANCE 0.04 = the looser
    # real-ooze value (probe-temp tip is slightly oozy; 0.03 risks a spurious abort).
    G90
    G1 X150 Y100 Z2 F6000             # tap at the bed CENTRE = the G28-Z reference (expected bed Z~0, so the height guard anchors at 0); a clean tip deposits nothing
    NOZZLE_CLEAN_GATE TOLERANCE=0.04

    {% set offbed = 0 if safe else params.OFFBED|default(1)|int %}   # 1 = Prusa off-bed Y-3 purge; 0 / safe-mode = on-bed prime fallback
    M117 Heating nozzle
    {% if offbed %}
        # --- Prusa-style OFF-BED purge (rides the DIRECTLY-PROBED Y-3 bed Z) -----------------------
        # Y-3 sits on the supported sheet (extends ~10mm past Y0); we probe the purge spot ITSELF and
        # purge at probed_z+0.2 -> no mesh/extrapolation guess (the 2026-06-21 crash was an UNPROBED
        # off-bed Z + no crash-stop). BED_MESH_PAUSE: Y-3 is OUTSIDE the mesh, where Klipper clamps the
        # front-edge comp (~1mm, wrong) -> probe+purge raw-frame, resume once back over the bed.
        BED_MESH_PAUSE
        _OFFBED_PURGE_PROBE              # probe Y-3 at the cool probe temp (clean tip) -> OFFBED_PURGE.purge_z
        M104 S{hotend}                   # NOW ramp to print temp (purge needs flow)
        M109 S{hotend}
        OFFBED_PURGE                     # front-edge stripe + dip-snap wipe at the probed Z
        G1 X150 Y100 F6000               # back over the bed at the purge safe Z (still mesh-paused = raw frame)
        BED_MESH_RESUME                  # restore the mesh now that we are over the mesh area
        G1 Z2 F1500                      # clearance for the slicer first travel
    {% else %}
        # --- ON-BED left-edge prime (fallback; pass OFFBED=0) -- supported bed, no front-edge risk ---
        M104 S{hotend}                   # ramp to print temp
        G90
        M83                              # relative E
        G1 X5 Y20 Z5 F6000
        M109 S{hotend}
        M117 Priming
        G1 Z0.3 F1200
        G92 E0
        G1 Y100 E7 F1200                 # THIN pass clears the tip
        G1 Y180 E13 F1000                # THICKEN establishes flow
        G1 X7 F5000
        G1 Y20 E10 F1000                 # return strip
        G92 E0
        G1 X25 Z0.05 F6000               # WIPE drag (Prusa depth)
        G1 X40 Z0.4 F12000               # SNAP -- break the string
        G1 Z2 F1500                      # lift clear
    {% endif %}
    M82                                  # absolute E
    {% if phasestep %}
        # Engage AFTER all homing/probing/purging -- direct-mode desyncs position; stays on for the
        # whole print, PRINT_END disengages. DEFAULT ON (since 2026-06-27); PHASE_STEP=0 or
        # SAFE_PRINT_MODE forces step/dir. Validated: 10+ phase-stepped prints on this firmware.
        M117 Phase-stepping
        PHASE_STEP_ON
    {% endif %}
    APPLY_SHEET                       # set the sheet Z-bias HERE -- AFTER the prime (so the prime runs
                                      # unsquished at offset 0) and right before the slicer's print body. Persists.
    _DEBUG_PRINT_OFFSET               # runtime offset log (sub-macro re-renders fresh; a { } expr is stale)
    {% if not phasestep %}
        CRASH_DETECT ENABLE=1{% if crash_shadow %} SHADOW=1{% endif %}             # arm StallGuard crash detection (SHADOW=telemetry-only tuning when CRASH_SHADOW on) for the print body (after all homing
    {% else %}
        # phase-stepping uses XDIRECT (not step/dir) -> StallGuard crash detection is inert.
        # Prusa makes the two mutually exclusive (MItem_crash.cpp). Skip arming when phase-stepped.
    {% endif %}
                                      # + mesh + prime). Guards fast travels; gated below ~54 mm/s. Disarmed in PRINT_END.
    ESTALL_DETECT ENABLE=1            # arm loadcell clog detection -- real extrusion begins now (also turns on the
                                      # HX717 12:1 interleave so ch-A force goes live). Disarmed in PRINT_END/CANCEL.
    M117

[gcode_macro _DEBUG_PRINT_OFFSET]
description: Log the current RUNTIME Z gcode-offset. Must be a sub-macro called as a command --
  a { } Jinja expr in a multi-step macro renders ONCE at that macro's invocation (stale), while a
  macro CALL re-renders fresh when the gcode stream reaches it.
gcode:
    { action_respond_info("Z gcode-offset = %.3f mm (sheet bias should show here)"
                          % printer.gcode_move.homing_origin.z) }

[gcode_macro PRINT_END]
gcode:
    M400
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=accel_ceiling VALUE=10000   # clear height-taper cap so idle/manual moves are unclamped
    CRASH_DETECT ENABLE=0             # disarm crash detection (restores TMC spreadCycle/stealthChop) so the
                                     # end park + the next G28 homing StallGuard are unaffected
    ESTALL_DETECT ENABLE=0           # disarm clog detection + hand the HX717 back to ch-B presence-only.
                                     # Covers CANCEL_PRINT too (it calls PRINT_END first).
    SET_GCODE_OFFSET Z=0 MOVE=0       # clear offset so it can't linger into next print's cold start
    CLEAR_INTERRUPTED                 # print done -> clear the power-loss checkpoint
    M104 S0
    M140 S0
    M106 S0
    M141 S0                          # release chamber target -> cooling fan idle
    G91
    {% if printer.extruder.temperature >= printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
        G1 E-1 F2400                  # light retract (Prusa Core One end-gcode) -- GUARDED: a soft-abort
                                      # during early heat-up reaches PRINT_END with a COLD nozzle, where an
                                      # unguarded retract throws "Extrude below minimum temp".
    {% endif %}
    G90
    # PRESENT the print: raise Z to AT LEAST 168mm clearance, matching Prusa's lift_head() =
    # min(Zmax, max(Z_NOZZLE_PARK_POINT_MIN 168, print_top + Z_NOZZLE_PARK_RISE 20)). Guarantees a
    # consistent, generous reach-in gap regardless of print height (replaces the old +100-relative;
    # Prusa does NOT do a "tiny lift" -- it verifiably lifts to >=168mm). Clamped to Zmax-5.
    # F3: a cancel during PRINT_START's heat/soak/mesh window (the most common cancel moment), or any
    # post-M84 unhomed state, leaves Z (and XY) unhomed -> an unconditional absolute Z move raises
    # "Must home axis first" and kills the macro mid-cleanup (motors energized, print_stats stuck,
    # CLEAR_PAUSE/SDCARD_RESET skipped). Guard the presentation lift on Z-homed; the cold-nozzle
    # retract above is already guarded.
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set zpres = [ [168, printer.toolhead.position.z + 20]|max, printer.toolhead.axis_maximum.z - 5]|min %}
        G1 Z{zpres} F900              # bed DOWN to >=168mm clearance -> part accessible
    {% endif %}
    {% if printer["gcode_macro PHASE_STEP_ON"].engaged %}
        # PHASE-STEP FRAME-CRASH GUARD (2026-06-28): phase-stepping was active this print, so the XY
        # kinematic position is DESYNCED from physical (open-loop XDIRECT, no feedback). SKIP the XY
        # park -- it would drive into the X+ frame; Z is already lifted (Z not phase-stepped, position
        # valid) so the part is accessible; PHASE_STEP_OFF + M84 follow; next print re-homes fresh.
        { action_respond_info("PRINT_END: phase-step was active -> XY desynced; SKIPPED XY park"
                              " (frame-crash guard). Z lifted; re-home before any XY move.") }
    {% elif 'xy' in printer.toolhead.homed_axes %}
        G1 X242 Y211 F10200           # park BACK-RIGHT (Prusa Core One end_gcode). Ymax 221.
        G4 P200                       # brief dwell to settle
    {% endif %}
    # F3: XY unhomed + not engaged (cancel during heat) -> no valid park target, skip park silently
    M572 S{printer.configfile.settings.extruder.pressure_advance}   # reset PA to config fallback (no stale PA between prints)
    {% if printer["gcode_macro PHASE_STEP_ON"].engaged %}
        PHASE_STEP_OFF REHOME=0       # disengage at the parked position (no re-home; next print homes fresh)
    {% endif %}
    M84

# --- Slicer M-code compatibility (Marlin/Prusa codes Klipper lacks) ------------
# OrcaSlicer's Core One profile emits a few Marlin M-codes Klipper doesn't define
# (seen as "Unknown command" on the first print). Map the meaningful ones:
#  M572 = pressure advance -- Prusa's Buddy fw uses the SAME PA model as Klipper
#         (pressure_advance + smooth_time), so S->ADVANCE / W->SMOOTH_TIME map 1:1.
#  M142 = heatbreak cooling temp -- no-op (our [heater_fan hotend_fan] already
#         auto-controls the heatbreak fan off the hotend temperature).
[gcode_macro M572]
description: Pressure advance (M572 [D][S<adv>][W<smooth>]) -> SET_PRESSURE_ADVANCE
gcode:
    {% if 'S' in params %}
        SET_PRESSURE_ADVANCE ADVANCE={params.S|float}{% if 'W' in params %} SMOOTH_TIME={params.W|float}{% endif %}
    {% endif %}

[gcode_macro M142]
description: Heatbreak cooling temp (Prusa) -- accepted, no-op (heater_fan handles it)
gcode:
    # no-op: Klipper's [heater_fan hotend_fan] auto-controls the heatbreak fan

[gcode_macro PID_CALIBRATE]
rename_existing: PID_CALIBRATE_BASE
description: PID tune + LCD phase "Calibrating PID".
gcode:
    M117 Calibrating PID
    PID_CALIBRATE_BASE {rawparams}
    M117

[gcode_macro SHAPER_CALIBRATE]
rename_existing: SHAPER_CALIBRATE_BASE
description: Input-shaper cal + LCD phase.
gcode:
    M117 Input shaper
    SHAPER_CALIBRATE_BASE {rawparams}
    M117

[gcode_macro CALIBRATE_PHASE_COGGING]
rename_existing: CALIBRATE_PHASE_COGGING_BASE
description: Cogging cal + LCD phase.
gcode:
    M117 Cogging cal
    CALIBRATE_PHASE_COGGING_BASE {rawparams}
    M117

[gcode_macro BELT_TUNE]
rename_existing: BELT_TUNE_BASE
description: Belt tune + LCD phase.
gcode:
    M117 Belt tune
    BELT_TUNE_BASE {rawparams}
    M117

[gcode_macro M73]
rename_existing: M73.1
description: Wrap native M73 -- keep P->progress (via M73.1), also stash R (slicer
  remaining minutes) so the LCD can show an ETA. Native M73 ignores R.
variable_remaining: 0
gcode:
    M73.1 {rawparams}
    {% if 'R' in params %}
        SET_GCODE_VARIABLE MACRO=M73 VARIABLE=remaining VALUE={params.R|int}
    {% endif %}

# --- Chamber temperature control (cooling-only, native temperature_fan) --------
# ext_chamber is a [temperature_fan] (see its section): it vents to hold the
# chamber at/below a target. M141/M191 set that target from the filament's
# chamber_temperature (PLA ~20 -> constant vent; ABS ~55 then off -> fan off,
# chamber stays warm). No Prusa-style M106 P3 N/G protocol needed -- the regulator
# IS the temperature_fan. (The filtration fan = P4/ext_filtration, separate, not
# fitted.) The part-cooling M106 (P0) stays Klipper-native, unmodified.
[gcode_macro M141]
description: Set chamber temperature target (cooling fan). S0 = off.
gcode:
    {% set s = params.S|default(0)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan=ext_chamber target={ 60 if s <= 0 else s }

[gcode_macro M191]
description: Set chamber target and wait. Heating only -- cooling targets skip.
gcode:
    {% set s = params.S|default(0)|float %}
    M141 S{ s }
    {% set cur = printer["temperature_fan ext_chamber"].temperature %}
    {% set to = params.TIMEOUT|default(1200)|float %}
    {% if s > cur + 1 %}
        # passive heating (chamber warms via the bed); only wait when below target.
        # TIMEOUT caps it (warn + continue) so a cold day can't hang -- see CHAMBER_WAIT.
        TEMPERATURE_WAIT SENSOR="temperature_fan ext_chamber" MINIMUM={ s } TIMEOUT={ to }
    {% endif %}

[gcode_macro CHAMBER_WAIT]
description: Wait for the chamber to passively reach MINIMUM (bed-heated). TIMEOUT (s, default
  20min) caps the wait — soft_cancel's TEMPERATURE_WAIT honors it, emits a periodic progress line
  (~10s, so a long-but-working soak never reads as a hang), and stays SOFT_ABORT-interruptible.
  ON_TIMEOUT at the cap: CONTINUE (default) prints anyway (cool-chamber warp risk); ABORT cleanly
  aborts — for chamber-critical materials (ASA/ABS). PRINT_START auto-sets ABORT when CHAMBER>=45.
gcode:
    {% set t = params.MINIMUM|default(0)|float %}
    {% set to = params.TIMEOUT|default(1200)|float %}
    {% set on_to = params.ON_TIMEOUT|default('CONTINUE')|upper %}
    {% if t > 0 %}
        TEMPERATURE_WAIT SENSOR="temperature_fan ext_chamber" MINIMUM={ t } TIMEOUT={ to }
        # TEMPERATURE_WAIT returns on reach OR at the TIMEOUT cap. The post-wait check MUST be a
        # sub-macro: this macro's Jinja is all rendered at invocation (before the wait runs), so
        # reading printer chamber-temp state inline here would see the temp at ENTRY, not after
        # the wait. (Also: never put Jinja delimiters in a comment -- Klipper still parses them.)
        _CHAMBER_WAIT_RESULT MINIMUM={ t } TIMEOUT={ to } ON_TIMEOUT={ on_to }
    {% endif %}

[gcode_macro _CHAMBER_WAIT_RESULT]
description: internal — CHAMBER_WAIT's post-wait check. Separate macro so its Jinja renders AFTER
  TEMPERATURE_WAIT returns (reads the true post-wait chamber temp). If still short of MINIMUM the
  wait hit its TIMEOUT cap: ON_TIMEOUT=ABORT raises a clean error, else warn loudly + continue.
gcode:
    {% set t = params.MINIMUM|float %}
    {% set to = params.TIMEOUT|float %}
    {% set on_to = params.ON_TIMEOUT|upper %}
    {% set now = printer['temperature_fan ext_chamber'].temperature|float %}
    {% if now < t %}
        {% if on_to == 'ABORT' %}
            { action_raise_error("CHAMBER_WAIT: chamber only reached %.0f of %.0f C in %.0fs -- ABORT (this material needs a warm enclosure; check the door / room temp, then restart)" % (now, t, to)) }
        {% else %}
            M117 Chamber {now|int}/{t|int}C - printing anyway
            M118 CHAMBER_WAIT: chamber only reached {now|round(1)} of {t|int}C at the {to|int}s cap -- continuing (cool-chamber warp risk)
        {% endif %}
    {% endif %}

[gcode_macro CHAMBER_FAN]
description: Cap the chamber cooling-fan speed (noise) -- MAX=0..1. Like Prusa tune.
# Re-passes the CURRENT target (SET_TEMPERATURE_FAN_TARGET defaults TARGET to the
# config value, which would reset the chamber target). variable_maxspeed feeds the
# LCD Tune menu item's live display. Session-only (resets to config on restart).
variable_maxspeed: 0.6
variable_minspeed: 0.0
gcode:
    {% set mx = params.MAX|default(printer["gcode_macro CHAMBER_FAN"].maxspeed)|float %}
    {% set mn = params.MIN|default(printer["gcode_macro CHAMBER_FAN"].minspeed)|float %}
    {% set t = printer["temperature_fan ext_chamber"].target %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan=ext_chamber TARGET={ t } MIN_SPEED={ mn } MAX_SPEED={ mx }
    SET_GCODE_VARIABLE MACRO=CHAMBER_FAN VARIABLE=maxspeed VALUE={ mx }
    SET_GCODE_VARIABLE MACRO=CHAMBER_FAN VARIABLE=minspeed VALUE={ mn }

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_paused_extruder_t: 0
variable_paused_bed_t: 0
gcode:
    {% set z = params.Z|default(10)|int %}
    # remember live temps so RESUME (or an idle-timeout hotend cool-down) can restore them
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=paused_extruder_t VALUE={ printer.extruder.target|int }
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=paused_bed_t VALUE={ printer.heater_bed.target|int }
    SAVE_GCODE_STATE NAME=pause_state
    PAUSE_BASE
    UPDATE_DELAYED_GCODE ID=_paused_bed_watchdog DURATION=7200   # A6: 2h -> drop bed if still paused
    # A1: guard the park like PRINT_END -- a Pause during PRINT_START's heat window (nozzle < min
    # extrude temp, Z deliberately unhomed) must not cold-extrude or blind-move a bad Z.
    {% set hot = printer.extruder.temperature >= printer.configfile.settings.extruder.min_extrude_temp|float %}
    G91
    {% if hot %}G1 E-2 F2700{% endif %}
    {% if 'z' in printer.toolhead.homed_axes %}G1 Z{z} F900{% endif %}
    G90
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}G1 X5 Y200 F6000{% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    _RUNOUT_LED_CLEAR
    UPDATE_DELAYED_GCODE ID=_paused_bed_watchdog DURATION=0      # A6: cancel the 2h bed-off timer
    # guard: if homing was lost (unexpected M84), do NOT blind-move with a bad Z -- abort clearly
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("RESUME: axes not homed (homing reference lost during pause) -- cannot safely restore position. Re-home and re-slice/restart.") }
    {% endif %}
    # restore temps the pause / idle cool-down may have dropped, and WAIT before any extrude or move
    {% set et = printer["gcode_macro PAUSE"].paused_extruder_t|int %}
    {% set bt = printer["gcode_macro PAUSE"].paused_bed_t|int %}
    {% if bt > 0 %}M190 S{bt}{% endif %}
    {% if et > 0 %}M109 S{et}{% endif %}
    G91
    G1 E2 F2700
    G90
    RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=100
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    PRINT_END
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE

[gcode_macro M600]
description: Filament change -- unload, prompt insert, auto load+purge on insert, then RESUME
variable_active: 0
gcode:
    ESTALL_BLOCK BLOCK=1                  # suppress clog detection across the change (UNLOAD ram/retract spikes force)
    {% if not printer.pause_resume.is_paused %}
        PAUSE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=active VALUE=1
    UNLOAD_FILAMENT
    M117 Insert filament
    M118 M600: insert new filament -- it auto-loads + purges, then RESUME to continue (PURGE_MORE for more)
    ESTALL_BLOCK BLOCK=0                  # the async auto-load on insert (LOAD_FILAMENT_AUTO) self-blocks separately

[gcode_macro LOAD_FILAMENT]
description: Load + purge the Nextruder, matched to Prusa's own Core One numbers
  (Buddy Configuration_COREONE_adv.h: slow-load 40@6, fast-load 20@25, purge @3 mm/s).
  The ONLY phase that pushes molten material out the tip -- the purge -- runs at 3 mm/s
  (~7 mm3/s), well under MVS (12-18), so it physically cannot smoke. The old macro
  extruded 50mm @ 30 mm/s = ~72 mm3/s = 4-6x MVS, which is what smoked when the path was
  already full. Heats to a safe load temp FIRST: never extrudes cold, and CAPS leftover
  heat (e.g. PETG 245 left in the block) down to the load temp so PLA can't fume.
  Mid-print / M600 keeps the print temp. Params: TEMP (default = load_temp),
  PURGE (default 20mm), PURGE_ONLY (1 = skip the load moves, just purge).
variable_load_temp: 220
gcode:
    # Keep the caller's temp during a print / pause / M600; otherwise cap to a safe load temp.
    {% set keep = printer.print_stats.state in ('printing', 'paused')
                  or printer['gcode_macro M600'].active|int == 1 %}
    {% set cur_t = printer.extruder.target|float %}
    {% set temp = params.TEMP|default(printer['gcode_macro LOAD_FILAMENT'].load_temp)|float %}
    {% if keep and cur_t >= 170 %}{% set temp = cur_t %}{% endif %}
    {% set purge = params.PURGE|default(20)|float %}
    {% set purge_only = params.PURGE_ONLY|default(0)|int %}
    ESTALL_BLOCK BLOCK=1              # load push + purge drive force forward (clog-like)
    M83
    M104 S{temp}                     # safe temp BEFORE any extrusion (guards cold-grind AND leftover-hot smoke)
    M109 S{temp}
    {% if not purge_only %}
        G1 E40 F360                  # slow load 40mm @ 6 mm/s  -- gentle grip/feed  (Prusa SLOW_LOAD)
        G1 E20 F1500                 # fast load 20mm @ 25 mm/s -- fills the cold path, not melting (Prusa FAST_LOAD)
    {% endif %}
    G1 E{purge} F180                 # purge @ 3 mm/s = ~7 mm3/s -- under MVS, cannot smoke (Prusa purge rate)
    M82
    ESTALL_BLOCK BLOCK=0

[gcode_macro LOAD_FILAMENT_AUTO]
description: Auto-load fired by the extruder filament sensor on insert. During an M600 it
  loads + purges at the saved print temp, then prompts for RESUME.
variable_load_temp: 220
gcode:
    {% if printer["gcode_macro M600"].active|int == 1 %}
        # --- M600 in progress: load + purge at the (saved) print temp, then wait for RESUME ---
        {% set pt = printer["gcode_macro PAUSE"].paused_extruder_t|int %}
        {% set lt = printer["gcode_macro LOAD_FILAMENT_AUTO"].load_temp|int %}
        {% set heat_to = pt if pt >= 170 else lt %}
        M118 M600: filament detected -- loading + purging at {heat_to}C
        {% if printer.extruder.temperature < (heat_to - 5) %}
            M104 S{heat_to}
            M109 S{heat_to}
        {% endif %}
        LOAD_FILAMENT
        M83
        ESTALL_BLOCK BLOCK=1             # suppress: M600 colour-clear purge (forward push while armed)
        G1 E40 F180                      # purge to clear the old colour @ 3 mm/s (<=MVS, no smoke)
        ESTALL_BLOCK BLOCK=0
        M82
        SET_GCODE_VARIABLE MACRO=M600 VARIABLE=active VALUE=0
        M117 RESUME to continue
        M118 M600: loaded + purged. RESUME to continue, or PURGE_MORE LEN=30 for more.
    {% elif printer.pause_resume.is_paused %}
        M118 Filament inserted during pause -- skipping auto-load (use RESUME/M600)
    {% else %}
        {% set t = printer["gcode_macro LOAD_FILAMENT_AUTO"].load_temp|int %}
        M118 Filament detected -- auto-loading (heating extruder to {t}C)
        M109 S{t}
        LOAD_FILAMENT
        M104 S0
        M118 Auto-load complete -- extruder heater off
    {% endif %}

[gcode_macro PURGE_MORE]
description: Purge more filament during an M600 colour-check (LEN mm, default 30)
gcode:
    {% set l = params.LEN|default(30)|float %}
    {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp|float %}
        M118 PURGE_MORE: extruder too cold to purge
    {% else %}
        M83
        ESTALL_BLOCK BLOCK=1             # suppress: manual colour-check purge during an M600 (armed)
        G1 E{l} F180                     # 3 mm/s (<=MVS, no smoke)
        ESTALL_BLOCK BLOCK=0
        M82
    {% endif %}

# === C7: Prusa print-checks M862.x -- accept + no-op (else Klipper errors on the
# unknown command and ABORTS the print). Klipper has no model/nozzle gating to enforce. ===
[gcode_macro M862.1]
description: Prusa nozzle-diameter check -- accepted, not enforced (Klipper)
gcode:
    {% if params %}{% endif %}
[gcode_macro M862.2]
description: Prusa printer-model(id) check -- accepted, not enforced (Klipper)
gcode:
    {% if params %}{% endif %}
[gcode_macro M862.3]
description: Prusa printer-model(name) check -- accepted, not enforced (Klipper)
gcode:
    {% if params %}{% endif %}
[gcode_macro M862.4]
description: Prusa firmware-version check -- accepted, not enforced (Klipper)
gcode:
    {% if params %}{% endif %}
[gcode_macro M862.5]
description: Prusa gcode-level check -- accepted, not enforced (Klipper)
gcode:
    {% if params %}{% endif %}
[gcode_macro M862.6]
description: Prusa features check -- accepted, not enforced (Klipper)
gcode:
    {% if params %}{% endif %}

# === C7: M104/M109 accept the Marlin R-form (R == S) so a PrusaSlicer/Marlin-style
# 'M109 R<t>' waits/sets instead of being read as S=0 (Klipper only reads S). ===
[gcode_macro M104]
rename_existing: M104.1
description: Set hotend temp; accepts Marlin R-form (R=S) for PrusaSlicer compat
gcode:
    {% if 'S' in params %}{% set t = params.S %}
    {% elif 'R' in params %}{% set t = params.R %}
    {% else %}{% set t = None %}{% endif %}
    {% if t is not none %}
        M104.1 S{t}{% if 'T' in params %} T{params.T}{% endif %}
    {% endif %}
[gcode_macro M109]
rename_existing: M109.1
description: Wait for hotend temp; accepts Marlin R-form (R=S) for PrusaSlicer compat
gcode:
    {% if 'S' in params %}{% set t = params.S %}
    {% elif 'R' in params %}{% set t = params.R %}
    {% else %}{% set t = None %}{% endif %}
    {% if t is not none %}
        M109.1 S{t}{% if 'T' in params %} T{params.T}{% endif %}
    {% endif %}

# === Marlin/Prusa g-code compat shims (defensive) — same rationale as the M862.x
# guards above: an unhandled g-code ABORTS the print on "Unknown command". Our
# OrcaSlicer klipper-flavor output emits NONE of these (verified), so they only matter
# if you run Prusa- or Marlin-sliced gcode. Where the intent is clean + safe we MAP it;
# for motion/limit codes we ACCEPT + NO-OP rather than let Marlin limits or a Marlin
# K-factor override the port's own accel model / M572 pressure advance. ===
[gcode_macro M300]
description: Marlin beep — accepted, no-op (no beeper on this build)
gcode:
    {% if params %}{% endif %}
[gcode_macro M701]
description: Marlin load-filament -> LOAD_FILAMENT (Marlin L/Z/T params ignored)
gcode:
    LOAD_FILAMENT
[gcode_macro M702]
description: Marlin unload-filament -> UNLOAD_FILAMENT
gcode:
    UNLOAD_FILAMENT
[gcode_macro G27]
description: Marlin park-nozzle — accepted, no-op (PRINT_END/PAUSE own parking here; a
  no-op avoids surprise motion from foreign gcode)
gcode:
    {% if params %}{% endif %}
# M24 (SD start/resume) + M25 (SD pause) are NATIVE Klipper commands (virtual_sdcard) --
# no shim needed, and adding one collides ("gcode command M24 already registered"). The
# native versions already do the right thing.
[gcode_macro M601]
description: Prusa pause-print -> PAUSE (only while printing)
gcode:
    {% if printer.print_stats.state == "printing" %}PAUSE{% endif %}
[gcode_macro M602]
description: Prusa resume-print -> RESUME when paused
gcode:
    {% if printer.pause_resume.is_paused %}RESUME{% endif %}
[gcode_macro M201]
description: Marlin set-max-accel — accepted, no-op (port owns accel via M204 + taper)
gcode:
    {% if params %}{% endif %}
[gcode_macro M203]
description: Marlin set-max-feedrate — accepted, no-op (port owns SET_VELOCITY_LIMIT)
gcode:
    {% if params %}{% endif %}
[gcode_macro M205]
description: Marlin set-jerk — accepted, no-op (port uses square_corner_velocity)
gcode:
    {% if params %}{% endif %}
[gcode_macro M900]
description: Marlin linear-advance — accepted, no-op (pressure advance is M572/slicer-owned)
gcode:
    {% if params %}{% endif %}

# === Layer triggers (lean): pause-at-layer / pause-next-layer ===
# REQUIRES a per-layer signal from the slicer. Our OrcaSlicer output emits only a
# ';LAYER_CHANGE' COMMENT (inert to Klipper), so add ONE line to the machine's
# "Layer Change G-code":   SET_PRINT_STATS_INFO CURRENT_LAYER=[layer_num]
# (That also feeds Mainsail's layer counter.) Until the slicer emits it, these are
# harmless no-ops -- the wrapper only acts when CURRENT_LAYER is present.
# Scope is deliberately pause-only: robust integer state, the one high-value trigger.
# Arbitrary gcode-at-layer + speed/flow/fan-at-layer were skipped (fragile dict state /
# duplicate the slicer).
[gcode_macro _LAYER_STATE]
description: internal store for the pending pause-at-layer (-1 = none)
variable_pause_at: -1
gcode:

[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause the print when it reaches LAYER=<n> (or NEXT=1 for the next layer).
  Needs the slicer CURRENT_LAYER signal (see the note above). LAYER=-1 cancels.
gcode:
    {% if params.NEXT|default(0)|int %}
        {% set c = printer.print_stats.info.current_layer %}
        {% set n = (c|int + 1) if c is not none else 0 %}
    {% else %}
        {% set n = params.LAYER|default(-1)|int %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LAYER_STATE VARIABLE=pause_at VALUE={n}
    M118 pause-at-layer {% if n < 0 %}cancelled{% else %}armed for layer {n}{% endif %}

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause at the next layer change (alias for SET_PAUSE_AT_LAYER NEXT=1)
gcode:
    SET_PAUSE_AT_LAYER NEXT=1

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: pass-through wrapper on the native command that also fires pause-at-layer
gcode:
    SET_PRINT_STATS_INFO_BASE {rawparams}
    {% if 'CURRENT_LAYER' in params %}
        {% set p = printer['gcode_macro _LAYER_STATE'].pause_at|int %}
        {% if p >= 0 and params.CURRENT_LAYER|int >= p %}
            SET_GCODE_VARIABLE MACRO=_LAYER_STATE VARIABLE=pause_at VALUE=-1
            M118 layer {params.CURRENT_LAYER}: triggering scheduled pause
            PAUSE
        {% endif %}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heat, form a clean blunt tip (ram + cooling moves), then slowly unload.
  Avoids the long stringy tip that catches/clogs on reload. Params:
  TEMP (default 215, ignored mid-print so M600 keeps the print temp),
  LENGTH (default 95 = final slow pull to clear the gears).
gcode:
    # A5: during a print / pause / M600 keep the PRINT temp (live target if set, else the saved
    # paused temp) so an idle-cooled M600 doesn't unload at the 215 default. Standalone = 215.
    {% set keep = printer.print_stats.state in ('printing', 'paused')
                  or printer['gcode_macro M600'].active|int == 1 %}
    {% set pt = printer['gcode_macro PAUSE'].paused_extruder_t|int %}
    {% set cur = printer.extruder.target|int %}
    {% set temp = (cur if cur >= 170 else (pt if pt >= 170 else 215)) if keep
                  else params.TEMP|default(215)|float %}
    {% set unload_len = params.LENGTH|default(95)|float %}
    {% set was_hot = printer.extruder.temperature >= (temp - 5) %}
    {% if not was_hot %}                   # never run cold (that grinds the gear)
        M104 S{temp}
        M109 S{temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=_unload_state
    M83
    ESTALL_BLOCK BLOCK=1             # suppress: deliberate ram + retract + cooling moves spike force (clog-like)
    # 1) Ram — build pressure so the tip forms full/blunt, not hollow/stringy
    G1 E12 F300
    # 2) Break the tip free of the nozzle melt
    G1 E-25 F1200
    # 3) Cooling moves — oscillate in the cool zone so the molten neck snaps
    #    and the tip blunts as it solidifies (the key anti-string step).
    #    Fast is safe here: filament is hot so it slips freely (gear chewing
    #    only happens cold/wedged). Amplitudes/speeds are sane defaults to tune.
    G1 E15 F2000
    G1 E-18 F2000
    G1 E15 F2400
    G1 E-20 F2400
    G1 E13 F2400
    G1 E-15 F2400
    # 4) Slow final pull to clear the drive gears (gentle = no chewing)
    G1 E-{unload_len} F300
    ESTALL_BLOCK BLOCK=0
    RESTORE_GCODE_STATE NAME=_unload_state
    {% if not keep %}
        M104 S0
    {% endif %}

# --- Multi-pass sensorless homing (Prusa-style robustness) -------------------
# Prusa's firmware re-bumps each XY axis until two probes agree within 0.075mm
# (refined to the TMC motor phase) — the "~3x per axis" you see. Klipper can't
# do the sub-step/phase precision or the spread-convergence check, so this just
# re-homes each axis PASSES times (back off, re-bump) for robustness. Comment out
# this whole macro to fall back to a normal single-touch G28. Tune PASSES/backoff
# on hardware (sensorless needs the back-off to rebuild homing speed).
# (multi-pass G28 override removed -- normal single-touch homing)

# --- Live Z / first-layer calibration (Prusa "Live Adjust Z" equivalent) ------
# Dial in the first layer live: Z_DOWN squishes more (nozzle closer), Z_UP backs off.
# Default STEP 0.01mm; pass STEP= to change. When the first layer looks right, run
# Z_OFFSET_SAVE to bake the live offset into the loadcell probe's z_offset + persist.
[gcode_macro Z_DOWN]
gcode:
    {% set s = params.STEP|default(0.01)|float %}
    SET_GCODE_OFFSET Z_ADJUST=-{s} MOVE=1
[gcode_macro Z_UP]
gcode:
    {% set s = params.STEP|default(0.01)|float %}
    SET_GCODE_OFFSET Z_ADJUST={s} MOVE=1
[gcode_macro Z_OFFSET_SAVE]
# Fold the current live Z offset into [load_cell_probe] z_offset and save (restarts).
gcode:
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG

# Lower the bed ~50mm for nozzle-cleaning / part access. This is the cleaning
# clearance that must NOT live in [safe_z_home] z_hop (a big z_hop makes the
# unhomed-home branch creep the bed toward the chamber floor + cripples far-bed
# homing -- see commit 2ef764b63). Homed move only, clamped to the Z range, so it
# can never creep or crash. +Z = bed DOWN (away from nozzle) on this machine.
[gcode_macro BED_DOWN]
description: Lower the bed ~50mm (DIST=) for nozzle cleaning / access; re-home (G28) when done
gcode:
    {% set d = params.DIST|default(50)|float %}
    {% if 'z' in printer.toolhead.homed_axes %}
        G90
        {% set zt = [printer.toolhead.position.z + d, printer.toolhead.axis_maximum.z - 5]|min %}
        G1 Z{zt} F900
        { action_respond_info("BED_DOWN: bed at Z%.0f -- clean/access, then G28 before printing." % zt) }
    {% else %}
        { action_respond_info("BED_DOWN: home Z first (G28).") }
    {% endif %}


# Prusa "First Layer Calibration" wizard equivalent: heat -> clean Z probe at probe_temp
# (nozzle not oozing) -> ramp to print temp -> print a single-layer serpentine patch at
# bed centre. Dial squish LIVE with Z_DOWN/Z_UP (or the LCD Live Adjust Z wheel) while it
# prints -- watch the lines go gappy(too high) -> evenly filled(good) -> rough/translucent
# (too low) -- then run Z_OFFSET_SAVE to bake it. Defaults: ASA on the textured sheet.
# REQUIRES filament loaded at the nozzle. Re-run with START_LIVEZ=0 to verify after a save.
[gcode_macro FIRST_LAYER_CAL]
description: First-layer / Live-Z calibration patch (ASA textured defaults)
gcode:
    {% set bed    = params.BED|default(100)|float %}
    {% set noz    = params.EXTRUDER|default(255)|float %}
    {% set ptemp  = params.PROBE_TEMP|default(150)|float %}
    {% set size   = params.SIZE|default(40)|float %}
    {% set fr     = (params.SPEED|default(30)|float) * 60 %}
    {% set lh     = params.LAYER|default(0.2)|float %}
    {% set lw     = params.WIDTH|default(0.45)|float %}
    {% set startz = params.START_LIVEZ|default(-0.04)|float %}   # SAFE mild squish; never start past a known dig
    {% set epm    = (lw * lh) / 2.405 %}            # E per mm of travel (1.75mm filament)
    {% set cx = params.CX|default(125)|float %}{% set cy = params.CY|default(105)|float %}   # move patch off a damaged spot
    {% set x0 = cx - size / 2.0 %}{% set x1 = cx + size / 2.0 %}
    {% set y0 = cy - size / 2.0 %}
    {% set nlines = (size / lw) | int %}
    M117 FLcal: heating
    M140 S{bed}
    M104 S{ptemp}                                   # clean, non-oozing probe temp
    M190 S{bed}
    M109 S{ptemp}
    M117 FLcal: homing
    G28                                             # clean loadcell Z probe (no ooze)
    M117 FLcal: heat nozzle
    M104 S{noz}
    M109 S{noz}                                     # ramp to ASA print temp
    SET_GCODE_OFFSET Z={startz} MOVE=1              # textured-ASA starting squish
    G90
    M83
    G92 E0
    G1 Z2 F1200
    G1 X{x0 - 12} Y{y0 - 4} F4500                   # to prime start
    G1 Z{lh} F600
    G1 X{x1} Y{y0 - 4} E{epm * (size + 12)} F1000   # prime line along the front
    G1 X{x0} Y{y0} F3000                            # to fill start
    {% for i in range(nlines) %}
        {% set y = y0 + i * lw %}
        {% set xend = x1 if (i % 2 == 0) else x0 %}
        G1 X{xend} Y{y} E{epm * size} F{fr}
        {% if not loop.last %}
            G1 Y{y0 + (i + 1) * lw} E{epm * lw} F{fr}
        {% endif %}
    {% endfor %}
    G1 Z5 F1200
    G1 X{cx} Y{cy} F3000
    M117 squish w/ Z_DOWN/Z_UP -> Z_OFFSET_SAVE
    RESPOND MSG="FIRST_LAYER_CAL done. Squish LIVE with Z_DOWN / Z_UP (or LCD Live Adjust Z) during the run; when the texture fills evenly run Z_OFFSET_SAVE to bake it."


# === Power-loss recovery (Guarded auto-resume) ===============================
# Klipper has no native PLR. PLR_CHECKPOINT (called each layer by the slicer's
# layer-change gcode) saves {file, file_pos, X, Y, Z, E, temps, fan%, speed%, flow%} to save_variables
# as ONE pipe-delimited string (a single blocking write -> no layer-change zit).
# On the next boot _plr_boot detects an interrupted print and announces it. The
# user runs RESUME_INTERRUPTED: re-heat -> restore saved Z (SET_KINEMATIC_POSITION;
# the Core One Tr-leadscrews self-lock so the bed holds on power-off) -> lift clear
# -> home XY (sensorless; NEVER G28 Z, that would loadcell-probe into the print) ->
# load saved mesh -> HALT. After eyeballing (Z right? nozzle clear of the part?), the
# user runs RESUME_PRINT_GO -> travel above the resume point -> drop to Z -> restore
# E -> resume the SD stream via M23/M26/M24. CLEAR_INTERRUPTED aborts. PRINT_END
# clears the flag (covers CANCEL via PRINT_END).
# ASSUMPTIONS to validate on hardware: (1) the bed holds Z on power-off (if it sags,
# the confirm gate catches it -> abort); (2) requires the slicer layer-change gcode
# to call PLR_CHECKPOINT; (3) resume fpos is ~read-ahead-ahead of the cut -> a small
# seam, minimised by checkpointing at the layer start. Filenames must be space-free.

[gcode_macro PLR_CHECKPOINT]
description: Save print state for power-loss recovery (call per layer from the slicer)
gcode:
    {% if printer.print_stats.state == "printing" %}
        {% set gp = printer.gcode_move.gcode_position %}
        {% set s = "%s|%d|%.3f|%.3f|%.3f|%.4f|%.0f|%.0f|%.0f|%.3f|%.3f|%.3f" % (
            printer.print_stats.filename, printer.virtual_sdcard.file_position,
            gp.x, gp.y, gp.z, gp.e, printer.heater_bed.target,
            printer.extruder.target, printer["temperature_fan ext_chamber"].target,
            printer.fan.speed, printer.gcode_move.speed_factor, printer.gcode_move.extrude_factor) %}
        SAVE_VARIABLE VARIABLE=plr VALUE="'{s}'"
        {% if printer.save_variables.variables.plr_active|default(0)|int != 1 %}
            SAVE_VARIABLE VARIABLE=plr_active VALUE=1   # only the first layer writes this
        {% endif %}
    {% endif %}

[gcode_macro CLEAR_INTERRUPTED]
description: Discard the saved power-loss checkpoint
gcode:
    SAVE_VARIABLE VARIABLE=plr_active VALUE=0

[delayed_gcode _plr_boot]
initial_duration: 3
gcode:
    {% set v = printer.save_variables.variables %}
    {% if v.plr_active|default(0)|int == 1 and v.plr|default('') %}
        {% set p = v.plr.split('|') %}
        { action_respond_info("*** POWER-LOSS RECOVERY *** an interrupted print was found:\n  file: %s\n  Z=%s  bed=%s  nozzle=%s\nRun RESUME_INTERRUPTED to recover, or CLEAR_INTERRUPTED to discard." % (p[0], p[4], p[6], p[7])) }
        M117 PLR: RESUME_INTERRUPTED?
    {% endif %}

[gcode_macro RESUME_INTERRUPTED]
description: Power-loss recovery prep — re-heat, restore Z, home XY, lift, then HALT for confirm
gcode:
    {% set v = printer.save_variables.variables %}
    {% if v.plr_active|default(0)|int != 1 or not v.plr|default('') %}
        { action_respond_info("No interrupted print saved. Nothing to resume.") }
    {% else %}
        {% set p = v.plr.split('|') %}
        {% set z = p[4]|float %}
        {% set bed = p[6]|float %}
        {% set ext = p[7]|float %}
        {% set cham = p[8]|float %}
        # A3: recovery is only valid from the COLD post-outage state. If Z is already homed the
        # reference is real and must NOT be overwritten by the (maybe stale) checkpoint. FORCE=1 overrides.
        {% if 'z' in printer.toolhead.homed_axes and params.FORCE|default(0)|int != 1 %}
            { action_raise_error("RESUME_INTERRUPTED: Z already homed -- resuming would overwrite the live reference with the saved checkpoint (Z=%.2f). Confirm the checkpoint is current, then re-run with FORCE=1 (or CLEAR_INTERRUPTED to discard)." % z) }
        {% endif %}
        M141 S{cham|int}
        M140 S{bed}
        M104 S{ext}
        M117 PLR: restore Z + home XY
        SET_KINEMATIC_POSITION Z={z}        # trust saved Z (bed held on power-off)
        G90
        G1 Z{z + 15} F600                   # lift clear BEFORE any XY move (A3: +15 vs a curled >5mm corner)
        G28 X Y                             # sensorless home XY (head is 15mm above the print)
        {% if 'default' in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=default   # can't re-probe over the print
        {% endif %}
        M117 PLR: heating
        M190 S{bed}
        M109 S{ext}
        { action_respond_info("PLR ready: Z=%.2f restored (+5 lift), bed/nozzle hot.\n  CHECK: is the nozzle clear of the part and Z about right?\n  -> RESUME_PRINT_GO to resume the print\n  -> CLEAR_INTERRUPTED to abort" % z) }
        M117 PLR: confirm -> RESUME_PRINT_GO
    {% endif %}

[gcode_macro RESUME_PRINT_GO]
description: Power-loss recovery — travel to the resume point, drop to Z, resume (after RESUME_INTERRUPTED)
gcode:
    {% set v = printer.save_variables.variables %}
    {% if v.plr_active|default(0)|int != 1 or not v.plr|default('') %}
        { action_respond_info("No interrupted print armed. Run RESUME_INTERRUPTED first.") }
    {% else %}
        {% set p = v.plr.split('|') %}
        {% set file = p[0] %}
        {% set fpos = p[1]|int %}
        {% set x = p[2]|float %}
        {% set y = p[3]|float %}
        {% set z = p[4]|float %}
        {% set e = p[5]|float %}
        M83
        G1 E2 F300                  # small prime (nozzle may have oozed/retracted in the gap)
        M82
        G92 E{e}                    # restore absolute E so the resumed gcode extrudes right
        # C8: restore speed%/flow%/fan% (guarded -- old 9-field checkpoints default to 100%/100%/off)
        {% set sf = (p[10]|float) if p|length > 10 else 1.0 %}
        {% set ef = (p[11]|float) if p|length > 11 else 1.0 %}
        {% set fan = (p[9]|float) if p|length > 9 else 0.0 %}
        M220 S{(sf*100)|round|int}
        M221 S{(ef*100)|round|int}
        M106 S{(fan*255)|round|int}
        G90
        G1 Z{z + 5} F600            # ensure clear
        G1 X{x} Y{y} F6000          # travel above where the print left off
        G1 Z{z} F300                # drop to print height
        # A7: checkpoint Z is offset-stripped (gcode_position); this resume does NOT re-apply the sheet
        # bias (APPLY_SHEET runs only in PRINT_START), so the seam layer is ~one sheet-bias (<=0.08mm)
        # over/under-squished. Bounded + accepted; to fix, store homing_origin.z in the checkpoint.
        M117 PLR: resuming
        M23 {file}
        M26 S{fpos}
        M24
        CLEAR_INTERRUPTED
    {% endif %}

# --- xBuddy extension (chamber fans / LED / filament) ------------------------
# The STM32H503 runs our Klipper port as a SECOND MCU over USB-C; its enclosure
# hardware ([mcu extension] + fans / LED / sensors) lives in h5/extension.cfg (below).

# Klipper appends a SAVE_CONFIG block at the end of this file after the first
# calibration (probe z_offset, bed_mesh, input_shaper, PID). Don't hand-edit it.


# === F427 extra monitoring sensors ==========================================
[temperature_sensor heatbreak]
sensor_type: Generic 3950
sensor_pin: PA6
# Nextruder heatbreak NTC (ADC1_IN6). Type/pullup approximate — monitoring only.
min_temp: 0
max_temp: 100

[temperature_sensor board]
sensor_type: Generic 3950
sensor_pin: PF10
# xBuddy board NTC (ADC3_IN8). Type/pullup approximate — monitoring only.
min_temp: 0
max_temp: 120

# --- xBuddy extension (H503) enclosure hardware ----------------------------
# The STM32H503 runs our Klipper port as a SECOND MCU over USB-C. Its HARDWARE
# ([mcu extension] + power rail + fans / LED / chamber sensor / spool sensor) lives in
# h5/extension.cfg (below). Enclosure MACROS (LIGHTS/DOOR/_RUNOUT_LED) + F427 inputs
# (ext_fault PB6, door_sensor PF5) stay in this file. SAVE_CONFIG (file tail) still applies.
[include h5/extension.cfg]

[output_pin fault_reset]  # xBuddy fault-memory latch reset = F427 PG7 (Buddy 'faultMemoryReset')
pin: PG7                  # stock pulses this at boot to clear HEATER/CURRENT/MMU fault latches
value: 1                  # high = deasserted; pulse low to reset the latches

# NB: do NOT auto-pulse fault_reset (PG7) at boot. A [delayed_gcode] doing so clears the MMU_FAULT
# latch, which IS the extension 24V power-on hold, so it DROPS the extension rail ~1.5s after boot
# (looks exactly like an H503 hang/collapse). D29 heater-fault stays cosmetically lit; clearing it
# correctly needs clear-before-power sequencing: ext_pwr low -> PG7 pulse -> ext_pwr high. (TODO.)

[hx71x_filament_sensor extruder]
pause_on_runout: False
insert_gcode:
    LOAD_FILAMENT_AUTO
event_delay: 3.0
# HOTEND/extruder filament sensor on the loadcell HX717 channel B (gain 8). Shares
# the probe's HX717 (mode-switch: ch B idle, ch A while probing); calibrated refs
# are in the SAVE_CONFIG block below. Detects filament AT the extruder + auto-loads
# on insert while idle -> LOAD_FILAMENT_AUTO.
# NOTE: runout / 'filament empty' detection is NOT here -- that belongs to the
# spool-side sensor (~30cm upstream, on the STM32H503 extension board), which is
# unreachable until the PuppyBus/Modbus bridge (Phase 5+). No runout-pause on this
# sensor. Test: FSENSOR_READ / QUERY_FILAMENT_SENSOR SENSOR=extruder.

# === Enclosure convenience macros + GPIO sensors ===
[gcode_macro LIGHTS]
gcode:
    {% set v = params.V|default(1.0)|float %}
    SET_PIN PIN=ext_wled VALUE={v}
    SET_LED LED=ext_rgbw WHITE={v}
[gcode_macro LIGHTS_OFF]
gcode:
    LIGHTS V=0

[gcode_macro _RUNOUT_LED]
description: red runout alert on the enclosure RGBW (keeps the white chamber light)
gcode:
    {% set w = printer["led ext_rgbw"].color_data[0][3] %}
    SET_LED LED=ext_rgbw RED=1 GREEN=0 BLUE=0 WHITE={w} SYNC=0

[gcode_macro _RUNOUT_LED_CLEAR]
description: clear the red runout alert (keeps the white chamber light)
gcode:
    {% set w = printer["led ext_rgbw"].color_data[0][3] %}
    SET_LED LED=ext_rgbw RED=0 GREEN=0 BLUE=0 WHITE={w} SYNC=0

# Behaviour lives in [gcode_macro DOOR]: door-open turns the chamber light on
# (auto-off a while AFTER the door closes); the door-open print PAUSE is OPT-IN.
[gcode_macro DOOR]
description: Door opts -- DOOR PAUSE=0/1 (auto-pause a print on door-open; default OFF), DOOR LIGHT=<sec> (chamber-light auto-off delay after the door closes; 0=off).
variable_pause: 0                    # 0 = no auto-pause on door-open (default; experts)
variable_light_sec: 120              # chamber-light auto-off delay after door closes
variable_saved_w: 0.0                # internal: light level before the door raised it
variable_active: 0                   # internal: door currently driving the light
gcode:
    {% if 'PAUSE' in params %}
        SET_GCODE_VARIABLE MACRO=DOOR VARIABLE=pause VALUE={params.PAUSE|int}
    {% endif %}
    {% if 'LIGHT' in params %}
        SET_GCODE_VARIABLE MACRO=DOOR VARIABLE=light_sec VALUE={params.LIGHT|int}
    {% endif %}
    RESPOND MSG="door: auto-pause={printer['gcode_macro DOOR'].pause}, light auto-off after close={printer['gcode_macro DOOR'].light_sec}s"

[delayed_gcode _door_light_off]
gcode:
    {% if printer.print_stats.state == "printing" %}
        LIGHTS V=1
    {% else %}
        LIGHTS V={printer["gcode_macro DOOR"].saved_w}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=DOOR VARIABLE=active VALUE=0

[gcode_button ext_fault]
# F427 PB6 = xBuddy-extension port OVERCURRENT latch (active-low: 1=OK pulled-up, 0=fault/power-cut).
# Previously visible only via PUPPY_DEBUG (src/puppybus.c). NOTE: PB6 is ALSO gpio_in_setup by
# puppybus.c; both configure it as a pull-up input, so they coexist. Alert is host-side only
# (M118/M117) -- the extension LED/fans are dead when the port power is cut, so don t drive them here.
pin: ^PB6
press_gcode:                          # FAULT latched (PB6 low)
    M118 EXT_FAULT: xBuddy-extension port OVERCURRENT -- enclosure power cut (fans/LEDs/chamber/spool offline)
    M117 EXT_FAULT: extension offline
    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("EXT_FAULT during print: enclosure venting + spool sensor offline. Not a motion hazard -- alert only; PAUSE manually if the material needs the chamber.") }
    {% endif %}
release_gcode:                        # fault cleared (PB6 high)
    M118 EXT_FAULT cleared -- extension port power restored

[gcode_button door_sensor]
pin: ^PF5
press_gcode:                         # door OPENED (PF5 low)
    {% set d = printer["gcode_macro DOOR"] %}
    {% if d.light_sec|int > 0 %}
        {% if not d.active|int %}     # remember the pre-door light level (once)
            SET_GCODE_VARIABLE MACRO=DOOR VARIABLE=saved_w VALUE={printer["led ext_rgbw"].color_data[0][3]}
            SET_GCODE_VARIABLE MACRO=DOOR VARIABLE=active VALUE=1
        {% endif %}
        LIGHTS V=1                     # light on while the door is open
        UPDATE_DELAYED_GCODE ID=_door_light_off DURATION=0   # cancel pending auto-off
    {% endif %}
    {% if d.pause|int and printer.print_stats.state == "printing" %}
        M118 Door opened -- pausing print
        M117 Door open -- paused
        _RUNOUT_LED
        PAUSE
    {% endif %}
release_gcode:                       # door CLOSED (PF5 high)
    {% set d = printer["gcode_macro DOOR"] %}
    {% if d.active|int and d.light_sec|int > 0 %}
        UPDATE_DELAYED_GCODE ID=_door_light_off DURATION={d.light_sec|int}  # start auto-off
    {% endif %}
    {% if printer.print_stats.state == "paused" %}
        M117 Door closed -- RESUME to continue
    {% endif %}

[led ext_rgbw]
red_pin: extension:PA3
green_pin: extension:PA2
blue_pin: extension:PA1
white_pin: extension:PA0
cycle_time: 0.00004
hardware_pwm: True

# Core One LCD = ILI9488 320x480 colour TFT on the F427's dedicated SPI6, driven as a
# standard Klipper display (lcd_type ili9488, klippy/extras/ili9488_display.py — registered
# in display.py via apply-overlay). Gives the stock status screen + [menu] + click-wheel.
# Owns PG4 (RST), PD11 (CS), PD15 (DC) + SPI6 (PG12/13/14). No MCU firmware change.
[display]
lcd_type: ili9488
spi_bus: spi6_PG12_PG14_PG13
spi_speed: 42000000
cs_pin: PD11
dc_pin: PD15
rst_pin: PG4
font_scale: 3
backlight: True
brightness: 128             # 0-255; ~50%. Adjust live with SET_DISPLAY_BACKLIGHT BRIGHTNESS=
# Core One click-wheel: rotary encoder (EN2=PD12, EN1=PD13) + press (jogWheelENC=PG3),
# all pull-up; click active-low (inverted). Pin order is EN2,EN1 so rotation is the
# right way round (EN1,EN2 scrolled reversed).
encoder_pins: ^PD12, ^PD13
encoder_steps_per_detent: 2   # this knob is 2 quadrature steps/detent (default 4 = 2 clicks/move)
click_pin: ^!PG3
# Backlight idle behaviour: dim/off after N seconds of no knob activity, wake on
# any encoder turn/click (and on print start). 0 disables. idle_brightness 0 = off.
backlight_timeout: 120        # dim/off after 2 min idle; wake on knob/print
idle_brightness: 0
menu_dma_cells: 32
display_group: _coreone_20x6  # custom 20x6 status layout (below)

# Chamber/enclosure icon (16x16) -> ~chamber~ in the chamber cell.
[display_glyph chamber]
data:
  ................
  ................
  ..************..
  ..*..........*..
  ..*..........*..
  ..*..........*..
  ..*..........*..
  ..*..........*..
  ..*..........*..
  ..*..........*..
  ..************..
  ..*..........*..
  ..*..........*..
  ..************..
  ................
  ................


# Custom 20x6 status layout for the ILI9488 (6 rows vs the stock 20x4's 4). Adds
# the enclosure chamber temp + Z height + a full-width progress bar. Heater icons
# are tinted by temperature in the driver (hot=red). Reuses the stock render
# templates (_heater_temperature / _printing_time / _print_status) + glyphs.
[display_data _coreone_20x6 extruder]
position: 0, 0
text: { render("_heater_temperature", param_heater_name="extruder") }

[display_data _coreone_20x6 heater_bed]
position: 0, 10
text: { render("_heater_temperature", param_heater_name="heater_bed") }

[display_data _coreone_20x6 feedrate]
position: 1, 0
text:
  ~feedrate~
  { "{:^4.0%}".format(printer.gcode_move.speed_factor) }

[display_data _coreone_20x6 fan]
position: 1, 10
text:
  {% if 'fan' in printer %}
    { "Fan {:^4.0%}".format(printer.fan.speed) }
  {% endif %}

[display_data _coreone_20x6 chamber]
position: 2, 0
text:
  {% if "temperature_fan ext_chamber" in printer %}
    ~chamber~
    { " %3.0f" % printer["temperature_fan ext_chamber"].temperature }
    ~degrees~
  {% endif %}

[display_data _coreone_20x6 zpos]
position: 2, 11
text:
  { "Z %5.2f" % printer.gcode_move.gcode_position.z }

[display_data _coreone_20x6 progress_text]
position: 3, 0
text:
  {% if 'virtual_sdcard' in printer and printer.virtual_sdcard.progress %}
    ~sd~
  {% else %}
    ~usb~
  {% endif %}
  { "{:^4.0%}".format(printer.display_status.progress) }

[display_data _coreone_20x6 printing_time]
position: 3, 11
text:
  ~clock~
  { ("%d:%02d" % (printer["gcode_macro M73"].remaining|int // 60, printer["gcode_macro M73"].remaining|int % 60)) if (printer.print_stats.state == "printing" and printer["gcode_macro M73"].remaining|int > 0) else render("_printing_time") }

[display_data _coreone_20x6 filename]
position: 4, 0
text:
  {% if printer.print_stats.filename and printer.print_stats.state in ('printing', 'paused') %}
    { printer.print_stats.filename.split('/')[-1].replace('.gcode','')[:20] }
  {% endif %}

[display_data _coreone_20x6 print_status]
position: 5, 0
text: { render("_print_status") }

# --- LCD Tune menu (click-wheel), Prusa-style live print tuning ----------------
# Override the stock [menu __main __tune] to DROP its `enable: Printing` gate, so
# Tune is reachable when IDLE too (pre-tune fan / temps / chamber before the print
# starts). Re-declaring the name overrides the stock item; its children stay.
[menu __main __tune]
type: list
name: Tune
# Then add the Prusa tune params Klipper's stock __tune lacks: Fan, Nozzle, Bed,
# plus the Core One chamber fan + chamber target. All apply live as you turn.
[menu __main __tune __partfan]
type: input
name: Fan {'%3d' % (menu.input*100)}%
input: {printer.fan.speed}
input_min: 0
input_max: 1.0
input_step: 0.05
realtime: True
gcode: M106 S{(menu.input*255)|int}

[menu __main __tune __noztemp]
type: input
name: Nozzle {'%3d' % menu.input}C
input: {printer.extruder.target}
input_min: 0
input_max: 300
input_step: 5
gcode: M104 S{menu.input|int}

[menu __main __tune __bedtemp]
type: input
name: Bed {'%3d' % menu.input}C
input: {printer.heater_bed.target}
input_min: 0
input_max: 120
input_step: 5
gcode: M140 S{menu.input|int}

[menu __main __tune __chamberfan]
type: input
name: Cham fan {'%3d' % (menu.input*100)}%
input: {printer["gcode_macro CHAMBER_FAN"].maxspeed}
input_min: 0
input_max: 1.0
input_step: 0.05
realtime: True
gcode: CHAMBER_FAN MAX={menu.input}

[menu __main __tune __chambertgt]
type: input
name: Cham tgt {'%3d' % menu.input}C
input: {printer["temperature_fan ext_chamber"].target}
input_min: 0
input_max: 60
input_step: 1
gcode: M141 S{menu.input|int}

# Live Adjust Z (Prusa equivalent): dial the first-layer offset on the wheel while
# the layer prints — the nozzle moves live (realtime). Negative = closer/more squish.
# Reads/writes the gcode-offset (same lever as Z_DOWN/Z_UP). "Save Live Z" folds it
# into the loadcell probe z_offset + SAVE_CONFIG (Z_OFFSET_SAVE; restarts klippy).
[menu __main __tune __livez]
type: input
name: Live Z {'%+.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -1.0
input_max: 1.0
input_step: 0.005
realtime: True
gcode: SET_GCODE_OFFSET Z={menu.input} MOVE=1

[menu __main __tune __livezsave]
type: command
name: Save Live Z
gcode: Z_OFFSET_SAVE

[phase_test]
# Phase 0 XDIRECT bring-up tool (extras/phase_test.py) — provides PHASE_TEST_*
# gcode for direct-mode TMC2130 coil-current testing. Experimental; safe idle.

[phase_exec stepper_x]
# Cogging correction (harmonic2/4 mag+pha, fwd+bwd) is PER-MACHINE -- it must be
# measured on YOUR motors (run the cogging calibration; see [phase_cogging] /
# extras/phase_cogging.py). Ships EMPTY = no correction (identity), which is exactly
# Prusa's uncalibrated default: base phase-stepping runs out-of-box, cogging is the
# optional refinement. Do NOT copy someone else's harmonics -- wrong values make
# motion worse, not better.
blend_vband_mmps: 10
dma: True

[phase_exec stepper_y]
# Per-machine cogging -- see [phase_exec stepper_x]. Calibrate on your own motors.
blend_vband_mmps: 10
dma: True
# Phase 1a high-rate XDIRECT executor (extras/phase_exec.py + src/phase_exec.c) —
# MCU timer streams coil currents to stepper_y's XDIRECT. PHASE_EXEC_START/STOP.

# [phase_exec stepper_z] + [phase_exec extruder] REMOVED 2026-07-26 (audit A4): dead Phase-2 bring-up
# tests, never engaged in production -- PHASE_STEP_ON only racks stepper_x+stepper_y; Z is step/dir
# FORCE_MOVE, E is step mode. Each allocated seg_ring[1024]x20B ~= 21KB -> freed ~42KB of F427 SRAM.
# (loadcell_pa_probe + phase_test are a different, tiny class and stay.)

# === Phase-stepping operator macros ==========================================
# Validated 2026-06-14: coordinated CoreXY XDIRECT phase-stepping, 8kHz, SWAP=1/1,
# 1:1 scale, loadcell+homing coexist (interrupt-driven HX717). MUST be homed first.
[gcode_macro PHASE_STEP_ON]
description: Engage coordinated CoreXY ANALYTIC phase-stepping on X+Y. Home first.
variable_engaged: 0
gcode:
    {% set rate = params.RATE|default(40000)|int %}
    {% set amp  = params.AMP|default(248)|int %}
    {% set cur  = params.CURRENT|default(0.55)|float %}
    {% if 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("PHASE_STEP_ON: home X/Y first (G28)") }
    {% endif %}
    # Analytic-trajectory engage (PHASE_TRAPQ_ENGAGE streams the live trapq as analytic
    # constant-accel segments; it enables the steppers + sets current internally). Validated
    # config: SPI_DIV=2 = 5.25MHz (Prusa's xBuddy SPI rate; >5.25 corrupts XDIRECT on this board),
    # XSIGN/YSIGN=-1 (CoreXY projection signs for this machine), IS=1 (fold in input shaping),
    # STEP_SUPPRESS=1 (detach X/Y step-gen), MERGE_TOL=0.001mm (coalesce shaped segs).
    PHASE_TRAPQ_ENGAGE STEPPER=stepper_x WITH=stepper_y RATE={rate} AMP={amp} CURRENT={cur} XSIGN=-1 YSIGN=-1 IS=1 STEP_SUPPRESS=1 SPI_DIV=2 CS_SLACK=0 MERGE_TOL=0.001
    SET_GCODE_VARIABLE MACRO=PHASE_STEP_ON VARIABLE=engaged VALUE=1
    { action_respond_info("Phase-stepping ON (analytic X+Y @ %dHz / 5.25MHz). G1 moves now run via XDIRECT. PHASE_STEP_OFF when done." % rate) }

[gcode_macro PHASE_STEP_OFF]
description: Disengage analytic phase-stepping, restore step/dir, re-home (REHOME=1 default).
gcode:
    {% set rehome = params.REHOME|default(1)|int %}
    PHASE_TRAPQ_DISENGAGE STEPPER=stepper_x   # stops both motors, clears direct_mode on X+Y, re-attaches step-gen
    SET_GCODE_VARIABLE MACRO=PHASE_STEP_ON VARIABLE=engaged VALUE=0
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.55 HOLDCURRENT=0.55   # restore configured run current
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.55 HOLDCURRENT=0.55
    { action_respond_info("Phase-stepping OFF." + (" Re-homing." if rehome else " Re-home before printing (position desynced).")) }
    {% if rehome %}
        G28
    {% endif %}

[precise_home stepper_y]
retract_dist: 15            # short, reliable re-home sweep + travel yardstick
tolerance: 0.8              # mm: |travel-R| under this == hit the real frame
converge_passes: 2
max_passes: 10
retract_speed: 40

[sg_profile]

[belt_tune]
accel_per_hz: 75
cycles: 40
sensor: sg
freq_start: 50
freq_end: 150
step: 2
measure_position: 125, 105

[gcode_macro Z_ALIGN]
description: Re-sync the single-driver Z lead-screws by ramming the bed to the bottom stops at reduced current (Prusa G162 analogue), then re-home Z. Run before BED_MESH if the bed is tilted.
gcode:
    {% set ramI = params.CURRENT|default(0.4)|float %}
    {% set runI = printer.configfile.settings['tmc2130 stepper_z'].run_current|float %}
    G28
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={ramI}
    FORCE_MOVE STEPPER=stepper_z DISTANCE=280 VELOCITY=15      # ram the bed DOWN to the bottom stops
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-3 VELOCITY=10       # relieve the stall pressure (still reduced current)
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={runI}          # restore full current BEFORE lifting the heavy bed
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-240 VELOCITY=20    # bring the bed back UP near the nozzle so the final
                                                             # G28 Z is a short ~30mm approach. The ram parks the bed
                                                             # ~270mm down, where a full-range home runs out of travel
                                                             # before reaching the nozzle -> "No trigger on probe after
                                                             # full movement" (fixed 2026-06-22). -240 from the hard
                                                             # stop leaves a SAFE ~30mm gap (no nozzle crash).
    G28 Z
    { action_respond_info("Z_ALIGN done: Z screws re-synced; Z re-homed. Re-run BED_MESH_CALIBRATE.") }

# Core One 3-point bed-level helper: loadcell-probe the three M3 adjuster-bolt positions so the
# gap deltas drive the bolt turns (1 turn = 0.5mm; anti-CW raises the bed). Each PROBE prints
# "bed will contact at z=" -- most-NEGATIVE = lowest corner -> raise it. Re-run after each adjust.
[gcode_macro LEVEL_PROBE]
description: Probe the 3 Core One bed-adjuster-bolt positions (FL 20,5 / FR 235,5 / BC 125,220)
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90   # force absolute (Mainsail jog may leave G91 -> drift)
    M117 LEVEL_PROBE FL
    G1 Z5 F600
    G1 X20 Y5 F6000
    PROBE
    M117 LEVEL_PROBE FR
    G1 Z5 F600
    G1 X235 Y5 F6000
    PROBE
    M117 LEVEL_PROBE BC
    G1 Z5 F600
    G1 X125 Y220 F6000
    PROBE
    G1 Z10 F600
    { action_respond_info("LEVEL_PROBE done -- read the 3 'bed will contact at z=' values above (FL, FR, BC).") }

# Report the current probed mesh Z span (max-min) -- the flatness metric [_UNEVEN_BED_CHECK] gates on.
[gcode_macro MESH_SPAN]
description: Report the current probed mesh Z span (max - min). Run after BED_MESH_CALIBRATE.
gcode:
    {% set ns = namespace(lo=99.0, hi=-99.0, n=0) %}
    {% for row in printer.bed_mesh.probed_matrix %}
    {% for z in row %}
    {% set ns.lo = [ns.lo, z]|min %}
    {% set ns.hi = [ns.hi, z]|max %}
    {% set ns.n = ns.n + 1 %}
    {% endfor %}
    {% endfor %}
    {% if ns.n > 0 %}
        { action_respond_info("Mesh Z span: %.3fmm (min %.3f, max %.3f, over %d pts)" % (ns.hi - ns.lo, ns.lo, ns.hi, ns.n)) }
    {% else %}
        { action_respond_info("MESH_SPAN: no probed mesh -- run BED_MESH_CALIBRATE first") }
    {% endif %}

# Prusa Core One "Uneven bed" prompt analogue (fw ubl/G29.cpp:316-334; MBL_Z_DIFF_CALIB_WARNING_THRESHOLD 2mm,
# COREONE-only). After the mesh probes, a large Z span (max-min across probed points) almost always means the
# CoreXY gantry is out of square -- and Z_ALIGN (our G162 Z-ram) is exactly the fix. Prusa PROMPTS Yes/No at
# 2mm; Klipper macros can't do a mid-run modal, so we AUTO-recover ONCE at 0.30mm: re-square + re-mesh,
# then if it is STILL uneven that is a real mechanical fault -> PAUSE for inspection (safer than Prusa's
# "No -> print on a bad bed"). Normal prints never trip it (real span ~0.035mm post 3x M3 bottom-plate fix).
# Threshold was 1.0mm (kit-tolerance era, ~0.86mm residual); tightened to 0.30mm 2026-08-20 after a 0.535mm
# front-back tilt sailed under 1.0 and failed a print. Wired into PRINT_START.
[gcode_macro _UNEVEN_BED_CHECK]
description: If the freshly-probed mesh Z span >= threshold (gantry likely out of square), auto Z_ALIGN + re-mesh once, then PAUSE if still uneven. PRINT_START calls this after BED_MESH_CALIBRATE.
variable_threshold: 0.30
gcode:
    {% set adaptive = params.ADAPTIVE|default(1)|int %}
    {% set ns = namespace(lo=99.0, hi=-99.0, n=0) %}
    {% for row in printer.bed_mesh.probed_matrix %}
    {% for z in row %}
    {% set ns.lo = [ns.lo, z]|min %}
    {% set ns.hi = [ns.hi, z]|max %}
    {% set ns.n = ns.n + 1 %}
    {% endfor %}
    {% endfor %}
    {% if ns.n > 0 and (ns.hi - ns.lo) >= threshold %}
        { action_respond_info("Uneven bed detected: mesh Z span %.3fmm >= %.2fmm -- re-squaring gantry (Z_ALIGN) + re-meshing" % (ns.hi - ns.lo, threshold)) }
        M117 Uneven bed: re-squaring
        Z_ALIGN
        BED_MESH_CLEAR
        {% if adaptive %}
            BED_MESH_CALIBRATE ADAPTIVE=1
        {% else %}
            BED_MESH_CALIBRATE
        {% endif %}
        _UNEVEN_BED_RECHECK
    {% elif ns.n > 0 %}
        { action_respond_info("Bed level OK: mesh Z span %.3fmm (< %.2fmm)" % (ns.hi - ns.lo, threshold)) }
    {% endif %}

[gcode_macro _UNEVEN_BED_RECHECK]
description: Re-check the mesh Z span after an uneven-bed Z_ALIGN recovery; PAUSE if still >= threshold (a real mechanical fault, not just Z-screw desync).
gcode:
    {% set threshold = printer["gcode_macro _UNEVEN_BED_CHECK"].threshold|float %}
    {% set ns = namespace(lo=99.0, hi=-99.0, n=0) %}
    {% for row in printer.bed_mesh.probed_matrix %}
    {% for z in row %}
    {% set ns.lo = [ns.lo, z]|min %}
    {% set ns.hi = [ns.hi, z]|max %}
    {% set ns.n = ns.n + 1 %}
    {% endfor %}
    {% endfor %}
    {% if ns.n > 0 and (ns.hi - ns.lo) >= threshold %}
        { action_respond_info("Bed STILL uneven after re-square: span %.3fmm >= %.2fmm -- likely a mechanical fault (belt/lead-screw/frame). PAUSING for inspection." % (ns.hi - ns.lo, threshold)) }
        M117 Bed still uneven - PAUSED
        PAUSE
    {% elif ns.n > 0 %}
        { action_respond_info("Re-square fixed it: mesh Z span now %.3fmm (< %.2fmm) -- continuing" % (ns.hi - ns.lo, threshold)) }
    {% endif %}

# Fast bed-tilt check: 4 mesh corners + centre (~40s vs full 25-pt mesh). Read the 5 'bed will
# contact at z=' values for front-back + left-right tilt while iterating; full mesh to confirm.
[gcode_macro QUICK_LEVEL]
description: Fast 5-point bed-tilt check (4 corners + centre) -- ~40s, for leveling iteration
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90   # force absolute (Mainsail jog may leave G91 -> drift)
    M117 QUICK_LEVEL FL
    G1 Z5 F600
    G1 X20 Y20 F9000
    PROBE
    M117 QUICK_LEVEL FR
    G1 Z5 F600
    G1 X230 Y20 F9000
    PROBE
    M117 QUICK_LEVEL BR
    G1 Z5 F600
    G1 X230 Y200 F9000
    PROBE
    M117 QUICK_LEVEL BL
    G1 Z5 F600
    G1 X20 Y200 F9000
    PROBE
    M117 QUICK_LEVEL C
    G1 Z5 F600
    G1 X125 Y105 F9000
    PROBE
    G1 Z10 F600
    { action_respond_info("QUICK_LEVEL done -- read the 5 'bed will contact at z=' (FL FR BR BL centre).") }

# Bulletproof Y homing: wrap G28 so the Y leg uses PRECISE_HOME (multi-pass,
# never rams) instead of the noisy single-touch native sensorless home. X and Z
# still flow through [safe_z_home] via prev_G28 (in_script bypasses recursion).


[phase_cogging]
accel_chip: lis3dh
harmonics: 2, 4
velocity: 8
distance: 30

# LCD: Main -> Sheet -> {textured | smooth | satin | Save Z}. Selecting a sheet
# applies its first-layer squish bias (SET_SHEET); "Save Z" folds the current
# Live-Z into the active sheet (SHEET_SAVE_Z). See [sheets] / extras/sheets.py.
[menu __main __sheets]
type: list
name: Sheet: {printer.sheets.active}

[menu __main __sheets __textured]
type: command
name: {'>' if printer.sheets.active == 'textured' else ' '} Textured {'%+.3f' % printer.sheets.offsets['textured']}
gcode: SET_SHEET NAME=textured

[menu __main __sheets __smooth]
type: command
name: {'>' if printer.sheets.active == 'smooth' else ' '} Smooth {'%+.3f' % printer.sheets.offsets['smooth']}
gcode: SET_SHEET NAME=smooth

[menu __main __sheets __satin]
type: command
name: {'>' if printer.sheets.active == 'satin' else ' '} Satin {'%+.3f' % printer.sheets.offsets['satin']}
gcode: SET_SHEET NAME=satin

[menu __main __sheets __savez]
type: command
name: Save Z to active
gcode: SHEET_SAVE_Z

[nozzle_clean_gate]
# Prusa cleanup_probe analogue (tip-clean tap gate). defaults: clean_count 3,
# z_tolerance 0.03, max_taps 9, step 2.0, cols 3, clearance 2.0


[gcode_macro OFFBED_PURGE]
# Prusa-style front-edge purge at Y=-3 (off the print area, on the supported
# sheet which extends ~10mm past Y0). Rides the DIRECTLY-PROBED bed Z there
# (purge_z, set by _OFFBED_PURGE_PROBE) -- NOT the mesh (Y-3 is outside it, so
# the caller MUST BED_MESH_PAUSE around probe+purge). At print temp, filament
# loaded. Replaces the on-bed prime. purge_z starts invalid as a run-order guard.
variable_purge_z: -100
gcode:
    {% set pz = printer["gcode_macro OFFBED_PURGE"].purge_z|float %}
    {% if pz < -1 %}
        { action_raise_error("OFFBED_PURGE: purge_z unset (%.2f) -- run _OFFBED_PURGE_PROBE first" % pz) }
    {% endif %}
    G90
    G1 Z{pz + 5} F1200
    G1 X235 Y-3 F6000                 # stripe start, above the sheet
    G1 Z{pz + 0.2} F600
    M83
    G92 E0
    G1 E2 F2400                       # de-retract / prime the tip
    G1 X225 E5 F500                   # stripe -- ramp speed to stabilise flow
    G1 X215 E4 F650
    G1 X205 E4 F800
    G1 X202 Z{pz + 0.05} F8000        # dip wipe (scrape the tip on the sheet)
    G1 X199 Z{pz + 0.2} F8000         # snap -- break the string off
    G1 Z{pz + 5} F1200                # lift clear
    M82
    G92 E0

[gcode_macro _OFFBED_PURGE_PROBE]
# Probe the purge spot at the COOL probe temp (clean tip, no ooze) to capture
# the true bed Z. Call with BED_MESH_PAUSE active (raw frame, matching purge).
gcode:
    G90
    G1 Z5 F1200
    G1 X217 Y-3 F6000
    G1 Z3 F600
    PROBE
    _OFFBED_PURGE_SAVE_Z

[gcode_macro _OFFBED_PURGE_SAVE_Z]
# Separate macro so the probe result re-renders fresh (Jinja renders once).
gcode:
    SET_GCODE_VARIABLE MACRO=OFFBED_PURGE VARIABLE=purge_z VALUE={printer.probe.last_z_result}
    M118 OFFBED purge_z = {"%.3f" % printer.probe.last_z_result}

[gcode_macro G28]
# UNIFIED VALIDATED HOMING OVERRIDE (core-one.1).
# Two jobs layered on the stock G28:
#  1. Phase-stepping guard (Prusa phase_stepping::EnsureDisabled analogue): homing
#     needs step/dir StallGuard; in direct-mode (XDIRECT) G28 cannot sense the frame
#     stall AND drives the axis the WRONG WAY (rams the back frame). So ALWAYS return
#     to step/dir before homing -- you cannot home in phstep mode (Prusa disables
#     phstep for every G28/G162/G425/belt-tune too).
#  2. Route X/Y through MSCNT_HOME (validate/retry + phase-snap) so EVERY G28 is as
#     robust as PRINT_START, plus Prusa grille avoidance: home Y first, jog Y->preempt_y,
#     THEN home X (X-first with no Y-clear can drive into the ventilation grille).
#     Z stays on [safe_z_home] (centre 125,110 + loadcell probe) via G28.1 Z.
# Recursion-safe: MSCNT_HOME's internal home calls G28.1 (native), never this macro.
# Escape: `G28 FAST=1` skips MSCNT and does the old native single-pass (quick interactive).
rename_existing: G28.1
variable_preempt_y: 15
gcode:
    {% if printer["gcode_macro PHASE_STEP_ON"].engaged %}
        { action_respond_info("G28: phase-stepping was ENGAGED -- disengaging before homing.") }
        # Full disengage via PHASE_STEP_OFF (cmd_TRAPQ_DISENGAGE): unlike the old PHASE_EXEC_STOP
        # it also runs _disengage_motor -- re-aligns XDIRECT to the frozen MSCNT BEFORE releasing
        # direct_mode, so clearing direct_mode can't snap the rotor +-1/2 electrical period
        # (~0.16mm) into the home that follows (the "phase off 512" trip-shift). REHOME=0 -> no
        # inner G28 (recursion-safe: PHASE_STEP_OFF only homes when REHOME=1); the homing below
        # is the re-home. PHASE_STEP_OFF also clears direct_mode + restores 0.55A run/hold current.
        PHASE_STEP_OFF REHOME=0
    {% endif %}
    # belt-and-braces: clear direct_mode even if a prior engage was interrupted
    # (direct_mode stuck on without the engaged flag -- a known phstep gotcha).
    SET_TMC_FIELD STEPPER=stepper_x FIELD=direct_mode VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=direct_mode VALUE=0

    # Pin a gentle homing accel (Prusa XY_HOMING_ACCELERATION 1250) independent of max_accel's
    # 10000 ceiling, so a sensorless StallGuard home is not slammed into the frame. Restored at end.
    # A11: if MSCNT_HOME exhausts retries + raises, the restore below is skipped and max_accel stays
    # 1250 until the next PRINT_START resets it -- self-healing, not a hazard.
    {% set prev_accel = printer.toolhead.max_accel %}
    {% set prev_scv = printer.toolhead.square_corner_velocity %}
    SET_VELOCITY_LIMIT ACCEL=1250 SQUARE_CORNER_VELOCITY=5
    {% set fast = (params.FAST | default(0) | int) == 1 %}
    {% set home_all = ('X' not in params) and ('Y' not in params) and ('Z' not in params) %}
    {% set req_x = home_all or ('X' in params) %}
    {% set req_y = home_all or ('Y' in params) %}
    {% set req_z = home_all or ('Z' in params) %}
    {% if fast %}
        # native single-pass (old behaviour: safe_z_home does XY + Z centre-probe)
        G28.1{% if req_x %} X{% endif %}{% if req_y %} Y{% endif %}{% if req_z %} Z{% endif %}
    {% else %}
        {% set homed = printer.toolhead.homed_axes %}
        {% set need_y = req_y or (req_x and 'y' not in homed) or (req_z and 'y' not in homed) %}
        {% set need_x = req_x or (req_z and 'x' not in homed) %}
        {% if need_x or need_y %}
            {% if 'z' in homed %}
                G91
                G1 Z5 F600
                G90
            {% else %}
                # Z UNHOMED (fresh boot / mid-print FIRMWARE_RESTART / abort): a normal G1 on an
                # unhomed axis is rejected, so create XY-sweep clearance via FORCE_MOVE. DISTANCE=+
                # moves the bed AWAY from the nozzle -- Z_ALIGN uses +280 to ram the bed DOWN to the
                # bottom stops -- so this ALWAYS increases the gap and can NEVER drive into the bed;
                # any over-travel is a benign bottom-stop bump. Without it, an unhomed G28 swept XY
                # with the bed still up near the nozzle and the nozzle dragged across the bed/print.
                FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=10
            {% endif %}
        {% endif %}
        {% if need_y %}
            MSCNT_HOME AXIS=Y
        {% endif %}
        {% if need_x %}
            G1 Y{ printer["gcode_macro G28"].preempt_y } F6000
            MSCNT_HOME AXIS=X
        {% endif %}
        {% if req_z %}
            G28.1 Z
        {% endif %}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={ prev_accel } SQUARE_CORNER_VELOCITY={ prev_scv }

[gcode_macro SAFE_PRINT_MODE]
description: Force the known-good print path (PHASE_STEP=0 + OFFBED=0) for ALL prints until cleared --
  for validating the new phase-stepping / off-bed-purge defaults. VALUE=1 on (default), VALUE=0 off. Persists.
gcode:
    {% set v = params.VALUE|default(1)|int %}
    SAVE_VARIABLE VARIABLE=safe_print_mode VALUE={v}
    { action_respond_info("Safe-print mode " + ("ON -> every PRINT_START forces step/dir + crash-detect + on-bed prime (PHASE_STEP=0 OFFBED=0)" if v else "OFF -> PRINT_START uses the new defaults (phase-stepping + off-bed purge)")) }

[gcode_macro CRASH_SHADOW]
description: Tuning aid -- when ON, PRINT_START arms crash detection in SHADOW telemetry mode
  (MCU accumulates + reports the sg_result distribution per print, NO shutdown) instead of the
  LIVE detector, on step/dir prints (PHASE_STEP=0 / SAFE_PRINT_MODE -- crash-detect needs
  phase-stepping OFF). VALUE=1 on, VALUE=0 off (default). Persists. Read the per-print
  `crash shadow [...]` log line to tune crash_sgt/sg_floor, then turn OFF to restore the live detector.
gcode:
    {% set v = params.VALUE|default(1)|int %}
    SAVE_VARIABLE VARIABLE=crash_shadow VALUE={v}
    { action_respond_info("Crash-detect SHADOW tuning mode " + ("ON -> PRINT_START arms CRASH_DETECT SHADOW=1 (telemetry only, no shutdown) on PHASE_STEP=0 prints. Turn OFF when tuned." if v else "OFF -> PRINT_START arms the LIVE crash detector")) }

[gcode_macro SET_VELOCITY_LIMIT]
# Height-aware accel CLAMP wrapper -- Prusa Core One M201-taper port.
# Klipper has a SINGLE max_accel (no separate cap register): SET_VELOCITY_LIMIT and
# M204 both just overwrite it, last-writer-wins. OrcaSlicer (klipper flavor) emits
# per-feature accel as `SET_VELOCITY_LIMIT ACCEL=.. ACCEL_TO_DECEL=..`. To reproduce
# Prusa's "M201 cap clamps the per-feature M204" we intercept SET_VELOCITY_LIMIT and
# clamp ACCEL down to accel_ceiling; the other params pass through a fixed WHITELIST below.
# A10: a Klipper version bump adding a NEW SET_VELOCITY_LIMIT param would be silently dropped
# -- add it to the passthrough list then (checklist item).
# accel_ceiling defaults 10000 (= no clamp); _ACCEL_TAPER lowers it above 150mm.
# Native command is renamed SET_VELOCITY_LIMIT_BASE (used by the taper to re-clamp).
rename_existing: SET_VELOCITY_LIMIT_BASE
variable_accel_ceiling: 10000
gcode:
    {% set p = params %}
    {% set ceil = printer['gcode_macro SET_VELOCITY_LIMIT'].accel_ceiling|float %}
    {% if 'ACCEL' in p %}{% set a = [p.ACCEL|float, ceil]|min %}{% endif %}
    SET_VELOCITY_LIMIT_BASE{% if 'ACCEL' in p %} ACCEL={a|int}{% endif %}{% if 'VELOCITY' in p %} VELOCITY={p.VELOCITY}{% endif %}{% if 'SQUARE_CORNER_VELOCITY' in p %} SQUARE_CORNER_VELOCITY={p.SQUARE_CORNER_VELOCITY}{% endif %}{% if 'MINIMUM_CRUISE_RATIO' in p %} MINIMUM_CRUISE_RATIO={p.MINIMUM_CRUISE_RATIO}{% endif %}{% if 'ACCEL_TO_DECEL' in p %} ACCEL_TO_DECEL={p.ACCEL_TO_DECEL}{% endif %}

[gcode_macro _ACCEL_TAPER]
# Called from the slicer's before_layer_change with the upcoming layer Z. Ports Prusa's
# Core One height taper (their before_layer_gcode interpolate_table, only emitted >150mm):
#   z <= 150  -> 10000 (machine ceiling, no taper)
#   150 < z <= 200 -> ramp 7000 -> 4000
#   200 < z <= 270 -> ramp 4000 -> 2000
# Updates accel_ceiling (clamps all subsequent per-feature SET_VELOCITY_LIMIT) and
# re-clamps the live accel immediately so the cap bites before the next feature command.
gcode:
    {% set z = params.Z|default(0)|float %}
    {% if z <= 150 %}{% set ceil = 10000 %}
    {% elif z <= 200 %}{% set ceil = (7000 + (4000 - 7000) * (z - 150) / 50.0)|int %}
    {% elif z <= 270 %}{% set ceil = (4000 + (2000 - 4000) * (z - 200) / 70.0)|int %}
    {% else %}{% set ceil = 2000 %}{% endif %}
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=accel_ceiling VALUE={ceil}
    {% if printer.toolhead.max_accel > ceil %}
        SET_VELOCITY_LIMIT_BASE ACCEL={ceil}
    {% endif %}
