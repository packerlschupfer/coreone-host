# xBuddy extension (STM32H503) — enclosure HARDWARE, [include]d from printer.cfg.
# Split out of the inlined block 2026-07-26 (FW-confirmed H503/F427 boundary). MACROS +
# F427 inputs (ext_fault/door_sensor) + hx71x loadcell stay in printer.cfg. SAVE_CONFIG
# (in printer.cfg) still applies to these sections via the merged namespace.

# --- xBuddy extension (H503) power rail (PG2) -- for the DFU flashing ritual --
[mcu extension]
# xBuddy extension STM32H503 (Klipper H5 port); F427 INITIAL_PINS=PG2 powers it at boot.
serial: /dev/serial/by-id/usb-Klipper_stm32h503xx_H503-if00

[output_pin ext_pwr]
pin: PG2
value: 1
shutdown_value: 1         # keep the H503 24V rail powered through an F427 shutdown — else a
                          # klippy shutdown (e.g. the H503 USB dropping during an SWD/RS-485
                          # H503 flash) would cut PG2 mid-flash. Default shutdown_value is 0.

[thermistor chamber_ntc]
temperature1: 25
resistance1: 100000
temperature2: 60
resistance2: 22480
temperature3: 100
resistance3: 5569

# === H503 enclosure chamber-cooling fan ======================================
# ext_chamber is a temperature_fan keyed to the chamber NTC: it VENTS to hold the
# chamber at/below target_temp (cooling-only — there is no active chamber heater).
# PLA sets target ~20 (< ambient) -> vents continuously -> cool chamber; ABS sets
# ~55 then "off" (60) -> fan off below target (chamber stays warm), engaging only
# on overshoot (also the overheat safety). Target is set per-filament via
# M141/M191. A temperature_fan OWNS its sensor, so there is no separate
# [temperature_sensor chamber] (folded in here — read it as
# `temperature_fan ext_chamber`). [tca6408a extension_fans] still gates fan power.
[temperature_fan ext_chamber]
pin: !extension:PA7
hardware_pwm: True
cycle_time: 0.00004
tachometer_pin: ^extension:PA8
tachometer_ppr: 4
sensor_type: chamber_ntc
sensor_pin: extension:PB1
pullup_resistor: 33000
min_temp: -50
max_temp: 120                 # sensor sanity -> Klipper shutdown if exceeded
control: watermark
max_delta: 2.0                # hysteresis dead-band (no fan-cycling near target)
target_temp: 60               # default "off": vents only above this (overheat safety)
max_speed: 0.3                # PLA vent speed (watermark on-speed). 100% is loud;
#   live-tunable like Prusa's tune menu: SET_TEMPERATURE_FAN_TARGET
#   temperature_fan=ext_chamber MAX_SPEED=<0-1>, or the LCD Tune > Cham fan item.
min_speed: 0.0

[fan_generic ext_filtration]
pin: !extension:PB0
hardware_pwm: True
cycle_time: 0.00004

[tca6408a extension_fans]
i2c_mcu: extension
i2c_bus: i2c2_PB10_PB13
enable_bits: 0x38

# === H503 enclosure LEDs: hardware PWM (white strip TIM3_CH1; RGBW accent TIM2_CH1-4) ===
[output_pin ext_wled]
pin: extension:PA6
pwm: True
hardware_pwm: True
cycle_time: 0.00004

[filament_switch_sensor ext_filament]
# Spool runout sensor on the H503 extension (PA5), ~30cm upstream of the extruder.
# Early-warning runout: PAUSE + red enclosure-LED alert; RESUME or reload clears it.
switch_pin: ^extension:PA5
pause_on_runout: False
runout_gcode:
    M118 Spool runout detected -- pausing print
    M117 Spool runout
    _RUNOUT_LED
    PAUSE
insert_gcode:
    M118 Spool filament detected
    _RUNOUT_LED_CLEAR
event_delay: 3.0

# --- Door sensor (Core One microswitch, F427 PF5) -----------------------------
# Prusa's "door sensor" is a mechanical microswitch (lever + roller); its
# "calibration" is just the screw that sets the trip distance. It's wired
# NORMALLY-CLOSED: door CLOSED -> lever PRESSED -> contact opens -> PF5 high ->
# Klipper "RELEASED"; door OPEN -> lever released -> contact to GND -> PF5 low ->
# Klipper "PRESSED". (So Klipper's button labels are inverted vs the lever -- the
# edges are what matter.) Plain digital switch -> Klipper reads it natively.
