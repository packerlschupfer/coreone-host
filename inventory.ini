# Klipper host inventory
#
# Point ansible_host at your Pi. Default is its LAN IP, which works from ANY
# control node. The mDNS name (klipper.local) is the alternative -- but it does
# NOT resolve from WSL2 or some corporate/VPN networks (own DNS namespace, no
# mDNS), and the failure looks misleadingly like "can't see my LAN devices".
# Prefer the IP if unsure. A static DHCP lease for the Pi is recommended.
# (See the "Control node" notes in README.md if you're on WSL2.)
#
# First run against a fresh Raspberry Pi OS image may need a password
# (ansible_password=... or --ask-pass; --ask-pass needs `sshpass` on the control
# node). The base role installs your SSH public key, after which key auth is used.

[klipper]
klippy ansible_host=192.168.1.50        # <- your Pi's IP  (or klipper.local if mDNS resolves from your control node)

[klipper:vars]
ansible_user=pi
ansible_python_interpreter=/usr/bin/python3
