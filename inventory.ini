# Klipper host inventory
#
# Point ansible_host at your Pi — either its mDNS name (klipper.local) or its
# LAN IP. A static DHCP lease for the Pi is recommended.
#
# First run against a fresh Raspberry Pi OS image may need a password
# (ansible_password=... or --ask-pass). The base role installs your SSH public
# key, after which key auth is used for every subsequent run.

[klipper]
klippy ansible_host=klipper.local       # or the Pi's IP, e.g. 192.168.1.50

[klipper:vars]
ansible_user=pi
ansible_python_interpreter=/usr/bin/python3
